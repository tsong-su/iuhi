        } catch(e) {
            questions = [{ idx: 1, tokens: ["載入失敗", "請重新匯出"], answerStr: "載入失敗請重新匯出", hint: "資料解析錯誤", altAudioUrls: [] }];
        }
        let currentIndex = 0;
        let sortableInstance = null;
        const colors = ["bg-emerald-100 text-emerald-900 border-emerald-300", "bg-pink-100 text-pink-900 border-pink-300", "bg-amber-100 text-amber-900 border-amber-300", "bg-teal-100 text-teal-900 border-teal-300", "bg-purple-100 text-purple-900 border-purple-300", "bg-cyan-100 text-cyan-900 border-cyan-300", "bg-rose-100 text-rose-900 border-rose-300", "bg-indigo-100 text-indigo-900 border-indigo-300"];
        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }
        function playSfx(type) {
            try {
                const sfx = document.getElementById(type === 'win' ? 'sfx-win' : 'sfx-wrong');
                if (sfx) { sfx.pause(); sfx.currentTime = 0; sfx.play().catch(e => { setTimeout(()=>sfx.play().catch(err=>{}), 100); }); }
            } catch(e) {}
        }
        function playSmartAudio(item) {
            if (!item || !item.altAudioUrls) return;
            let urls = [...item.altAudioUrls];
            const player = document.getElementById('lesson-audio');
            if (!player) return;
            function tryPlay(index) {
                if (index >= urls.length) return;
                player.src = urls[index];
                player.currentTime = 0;
                player.play().catch(() => { tryPlay(index + 1); });
            }
            tryPlay(0);
        }
        function startConfetti() {
            const confettiColors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#fbbf24'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                document.body.appendChild(confetti);
            }
        }
        function renderGame() {
            const container = document.getElementById('game-main-container');
            if (!container) return;
            if (currentIndex >= questions.length) {
                container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-8 rounded-3xl shadow-xl text-center space-y-4"><div class="text-5xl">🏆</div><h2 class="text-2xl font-extrabold text-white">恭喜過關！</h2><p class="text-xs text-pink-100">您已完成本課所有的句子重組挑戰！</p><button onclick="resetGame()" class="px-6 py-3 bg-white text-indigo-700 font-extrabold rounded-2xl shadow-md cursor-pointer hover:bg-pink-50 transition">🔄 閣挑戰一擺</button></div>';
                startConfetti();
                setTimeout(() => { playSfx('win'); }, 300);
                return;
            }
            const q = questions[currentIndex];
            const shuffled = shuffle(q.tokens);
            container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-4 rounded-3xl shadow flex items-center justify-between"><div><span class="bg-white/20 text-[10px] px-2.5 py-0.5 rounded-full font-bold">第 ' + (currentIndex + 1) + ' / ' + questions.length + ' 關</span><div class="text-xs text-pink-100 mt-1">💡 提示：' + q.hint + '</div></div><button onclick=\'playSmartAudio(' + JSON.stringify(q) + ')\' class="bg-white text-indigo-700 px-3.5 py-2 rounded-2xl text-xs font-extrabold shadow cursor-pointer">🔊 聽語音</button></div>' +
                '<div id="student-drag-box" class="p-5 rounded-3xl border-2 border-dashed border-indigo-300 min-h-[120px] flex flex-wrap items-center gap-2.5 bg-slate-50">' +
                shuffled.map((t, i) => '<div class="' + colors[i % colors.length] + ' px-4 py-2.5 rounded-2xl font-extrabold text-xs shadow-md border cursor-grab select-none transition transform hover:scale-105">' + t + '</div>').join('') +
                '</div>' +
                '<div id="student-msg" class="text-xs font-bold min-h-[1.5em] text-center"></div>' +
                '<div class="flex items-center justify-between pt-2"><button onclick="checkAnswer()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow cursor-pointer">✅ 確認答案</button><button onclick="nextQuestion()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow cursor-pointer">下一關 &rarr;</button></div>';
            const dragBox = document.getElementById('student-drag-box');
            if (dragBox) {
                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = new Sortable(dragBox, { animation: 150, ghostClass: 'opacity-50' });
            }
            setTimeout(() => { playSmartAudio(q); }, 400);
        }
        function checkAnswer() {
            const q = questions[currentIndex];
            const dragBox = document.getElementById('student-drag-box');
            const msg = document.getElementById('student-msg');
            if (!dragBox || !msg) return;
            const userStr = Array.from(dragBox.children).map(el => el.textContent.trim()).join('');
            if (userStr === q.answerStr) {
                playSfx('win');
                msg.textContent = "✅ 答對了！真厲害！";
                msg.style.color = "#059669";
            } else {
                playSfx('wrong');
                msg.textContent = "❌ 毋著喔！順序不對！";
                msg.style.color = "#dc2626";
            }
        }
        function nextQuestion() { currentIndex++; renderGame(); }
        function resetGame() { currentIndex = 0; renderGame(); }
        window.onload = function() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
                const alertBox = document.getElementById('line-browser-alert');
                if (alertBox) alertBox.classList.remove('hidden');
            }
            renderGame();
        };
    </script>
</body>
</html>
