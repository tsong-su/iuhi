<script src="https://cdn.tailwindcss.com"></script>

<script>
const questions = [{"idx":1,"tokens":["這對","雙生仔","生做","一模一樣","呢"],"answerStr":"這對雙生仔生做一模一樣呢","hint":"這對雙生仔生做一模一樣呢","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_1.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_1.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_1.mp3"]},{"idx":2,"tokens":["這台","冰箱","是","二手的","所以","較","俗"],"answerStr":"這台冰箱是二手的所以較俗","hint":"這台冰箱是二手的所以較俗","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_2.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_2.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_2.mp3"]},{"idx":3,"tokens":["阿叔","三不五時","就會","來","阮","兜","行踏"],"answerStr":"阿叔三不五時就會來阮兜行踏","hint":"阿叔三不五時就會來阮兜行踏","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_3.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_3.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_3.mp3"]},{"idx":4,"tokens":["伊","無閒","規工","這馬","忝","甲","四肢","無力"],"answerStr":"伊無閒規工這馬忝甲四肢無力","hint":"伊無閒規工這馬忝甲四肢無力","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_4.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_4.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_4.mp3"]},{"idx":5,"tokens":["阿母","去","五金行","買","電池","轉來","換"],"answerStr":"阿母去五金行買電池轉來換","hint":"阿母去五金行買電池轉來換","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_5.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_5.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_5.mp3"]},{"idx":6,"tokens":["向望","今年","六畜興旺","稻仔","好","收成"],"answerStr":"向望今年六畜興旺稻仔好收成","hint":"向望今年六畜興旺稻仔好收成","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_6.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_6.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_6.mp3"]},{"idx":7,"tokens":["阿兄","歇睏","攏","睏甲","七晏八晏","才","起來"],"answerStr":"阿兄歇睏攏睏甲七晏八晏才起來","hint":"阿兄歇睏攏睏甲七晏八晏才起來","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_7.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_7.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_7.mp3"]},{"idx":8,"tokens":["阮","明仔載","欲去","彰化","的","八卦山","𨑨迌"],"answerStr":"阮明仔載欲去彰化的八卦山𨑨迌","hint":"阮明仔載欲去彰化的八卦山𨑨迌","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_8.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_8.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_8.mp3"]},{"idx":9,"tokens":["屏東縣","九如鄉","的","檸檬","酸","閣","厚","汁"],"answerStr":"屏東縣九如鄉的檸檬酸閣厚汁","hint":"屏東縣九如鄉的檸檬酸閣厚汁","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_9.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_9.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_9.mp3"]},{"idx":10,"tokens":["遮的","滷味","攏總","兩百","空","五","箍"],"answerStr":"遮的滷味攏總兩百空五箍","hint":"遮的滷味攏總兩百空五箍","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_10.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_10.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_10.mp3"]},{"idx":11,"tokens":["阿姊","去","病院","抽血","做","檢查"],"answerStr":"阿姊去病院抽血做檢查","hint":"阿姊去病院抽血做檢查","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_11.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_11.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_11.mp3"]},{"idx":12,"tokens":["阿公","下晡","欲去","骨科","門診","看","跤頭趺"],"answerStr":"阿公下晡欲去骨科門診看跤頭趺","hint":"阿公下晡欲去骨科門診看跤頭趺","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_12.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_12.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_12.mp3"]},{"idx":13,"tokens":["阿爸","去","便利商店","納錢","猶未","轉來"],"answerStr":"阿爸去便利商店納錢猶未轉來","hint":"阿爸去便利商店納錢猶未轉來","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_13.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_13.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_13.mp3"]},{"idx":14,"tokens":["你","後擺","回診","就","會使","拆","石膏","矣"],"answerStr":"你後擺回診就會使拆石膏矣","hint":"你後擺回診就會使拆石膏矣","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_14.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_14.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_14.mp3"]},{"idx":15,"tokens":["我","提","藥單","去","藥局","提藥仔"],"answerStr":"我提藥單去藥局提藥仔","hint":"我提藥單去藥局提藥仔","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_15.mp3","altAudioUrls":["https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B11_Example_2_15.mp3","https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B11_Example_2_15.mp3"]}];
let currentIndex = 0;
let sortableInstance = null;
const colors = ["bg-emerald-100 text-emerald-900 border-emerald-300", "bg-pink-100 text-pink-900 border-pink-300", "bg-amber-100 text-amber-900 border-amber-300", "bg-teal-100 text-teal-900 border-teal-300", "bg-purple-100 text-purple-900 border-purple-300", "bg-cyan-100 text-cyan-900 border-cyan-300"];
function shuffle(array) { const copy = [...array]; for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; } return copy; }
function playSmartAudio(item) {
if (!item || !item.altAudioUrls) return;
let urls = [...item.altAudioUrls];
function tryPlay(index) {
if (index >= urls.length) return;
let a = new Audio(urls[index]);
a.play().catch(() => { tryPlay(index + 1); });
}
tryPlay(0);
}
function startConfetti() {
const confettiColors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#fbbf24'];
for (let i = 0; i < 60; i++) {
const confetti = document.createElement('div');
confetti.className = 'confetti';
confetti.style.left = Math.random() * 100 + 'vw';
confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
confetti.style.animationDelay = (Math.random() * 1.5) + 's';
document.body.appendChild(confetti);
}
}
function renderGame() {
const container = document.getElementById('game-main-container');
if (!container) return;
if (currentIndex >= questions.length) {
container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-8 rounded-3xl shadow-xl text-center space-y-4"><div class="text-5xl">🏆</div><h2 class="text-2xl font-extrabold text-white">恭喜過關！</h2><button onclick="resetGame()" class="px-6 py-3 bg-white text-indigo-700 font-extrabold rounded-2xl shadow-md">🔄 閣挑戰一擺</button></div>';
startConfetti();
setTimeout(() => { const w = document.getElementById('sfx-win'); if(w) { w.currentTime=0; w.play().catch(e=>{}); } }, 500);
return;
}
const q = questions[currentIndex];
const shuffled = shuffle(q.tokens);
container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-4 rounded-3xl shadow flex items-center justify-between"><div><span class="bg-white/20 text-[10px] px-2.5 py-0.5 rounded-full font-bold">第 ' + (currentIndex + 1) + ' / ' + questions.length + ' 關</span><div class="text-xs text-pink-100 mt-1">💡 提示：' + q.hint + '</div></div><button onclick=\'playSmartAudio(' + JSON.stringify(q) + ')\' class="bg-white text-indigo-700 px-3.5 py-2 rounded-2xl text-xs font-extrabold shadow cursor-pointer">🔊 聽語音</button></div><div id="student-drag-box" class="p-5 rounded-3xl border-2 border-dashed border-indigo-300 min-h-[120px] flex flex-wrap items-center gap-2.5 bg-slate-50">' + shuffled.map((t, i) => '<div class="' + colors[i % colors.length] + ' px-4 py-2.5 rounded-2xl font-extrabold text-xs shadow-md border cursor-grab select-none">' + t + '</div>').join('') + '</div><div id="student-msg" class="text-xs font-bold min-h-[1.5em] text-center"></div><div class="flex items-center justify-between pt-2"><button onclick="checkAnswer()" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs shadow">✅ 確認答案</button><button onclick="nextQuestion()" class="px-4 py-2.5 bg-indigo-600 text-white font-bold rounded-xl text-xs shadow">下一關 &rarr;</button></div>';
const dragBox = document.getElementById('student-drag-box');
if (dragBox) {
if (sortableInstance) sortableInstance.destroy();
sortableInstance = new Sortable(dragBox, { animation: 150, ghostClass: 'opacity-50' });
}
setTimeout(() => { playSmartAudio(q); }, 400);
}
function checkAnswer() {
const q = questions[currentIndex];
const dragBox = document.getElementById('student-drag-box');
const msg = document.getElementById('student-msg');
const userStr = Array.from(dragBox.children).map(el => el.textContent.trim()).join('');
if (userStr === q.answerStr) {
const w = document.getElementById('sfx-win'); if(w) { w.currentTime=0; w.play().catch(e=>{}); }
msg.textContent = "✅ 答對了！有夠𠢕！"; msg.style.color = "#059669";
} else {
const wr = document.getElementById('sfx-wrong'); if(wr) { wr.currentTime=0; wr.play().catch(e=>{}); }
msg.textContent = "❌ 毋著喔！順序不對！"; msg.style.color = "#dc2626";
}
}
function nextQuestion() { currentIndex++; renderGame(); }
function resetGame() { currentIndex = 0; renderGame(); }
window.onload = function() {
renderGame();
document.body.addEventListener('click', function unlockAudio() {
const q = questions[currentIndex];
if (q) { playSmartAudio(q); }
document.body.removeEventListener('click', unlockAudio);
}, { once: true });
};
</script>
</body>
