    <script>

            theme: {
                extend: {
                    colors: {
                        zodiac: {
                            red: '#9A1D23',
                            gold: '#D4AF37',
                            goldLight: '#FBF7ED',
                            dark: '#1C1917',
                            cream: '#FCFBF7',
                            green: '#15803D'

                    },

                        sans: ['Noto Sans TC', 'sans-serif'],

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F6F4F0;
            background-image: radial-gradient(#e2ded4 1px, transparent 1px);
            background-size: 24px 24px;
            overflow-x: hidden;
        }

        /* 縮放動畫：生肖卡片庫懸浮效果 */
        .zodiac-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .zodiac-card:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 12px -2px rgba(154, 29, 35, 0.25);
        }

        /* 配對成功：綠色漸變呼吸燈特效 */
        .success-pulse {
            animation: success-glow 2s infinite alternate;
        }
        @keyframes success-glow {
            0% { box-shadow: 0 0 4px rgba(21, 128, 61, 0.2); }
            100% { box-shadow: 0 0 12px rgba(21, 128, 61, 0.5); }
        }

        /* 拖曳懸浮時的提示 */
        .drag-over {
            border-color: #9A1D23 !important;
            background-color: #FFF5F5 !important;
            transform: scale(1.02);
        }

        /* 行動裝置點選配對狀態 */
        .card-selected {
            outline: 4px solid #9A1D23;
            outline-offset: 2px;
            background-color: #FFF5F5 !important;
            animation: pulse-border 1s infinite ease-in-out;
        }
        @keyframes pulse-border {
            0%, 100% { transform: scale(1.04); }
            50% { transform: scale(0.98); }
        }

        /* 錯誤配對時的震動反饋 */
        .shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* 隱藏捲軸但保持功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        // 安全網址解碼防護機制
        function handleImgError(img, filename, emoji) {
            const encodedName = encodeURIComponent(filename);
            if (!img.dataset.retryCount) {
                img.dataset.retryCount = "1";
                img.src = `https://cdn.jsdelivr.net/gh/tsong-su/iuhi@main/zodiac_assets/${encodedName}`;
            } else if (img.dataset.retryCount === "1") {
                img.dataset.retryCount = "2";
                img.src = `./zodiac_assets/${filename}`;
            } else {
                img.style.display = 'none';
                const fallbackElement = img.nextElementSibling;
                if (fallbackElement) {
                    fallbackElement.style.display = 'flex';
                }
            }
        }
    </script>

        let gameState = {
            matches: {},
            selectedCardId: null,
            showAnswersEnabled: false
        };

        function getImageUrl(zodiac) {
            return GITHUB_BASE_URL + encodeURIComponent(zodiac.image);
        }

        window.onload = () => {
            initGame();
        };

        function initGame() {
            renderSlots();
            renderCardPool();
            updateProgress();
            closeVictory();
            closeExtModal();
            gameState.selectedCardId = null;
        }

        // 渲染配對棋盤 (將排序編號修改為純數字 1-12，無前導零)
        function renderSlots() {
            const grid = document.getElementById('board-grid');
            grid.innerHTML = '';

            ZODIAC_DATA.forEach(zodiac => {
                const slot = document.createElement('div');
                slot.className = `relative aspect-[1.1/1] md:aspect-square rounded-xl border-2 border-dashed border-stone-300 bg-stone-50 flex flex-col items-center justify-center p-1 text-center transition-all cursor-pointer group hover:bg-stone-100/60`;
                slot.dataset.slotId = zodiac.id;
                
                // 💡 調整為不帶前導零的純整數排序 1-12
                const orderNum = zodiac.id;
                
                slot.innerHTML = `
                    <div class="absolute top-0.5 left-1 text-[10px] font-bold text-stone-400 group-hover:text-zodiac-red">
                        ${orderNum}
                    </div>
                    
                    <div class="absolute top-0.5 right-1 text-[10px] font-black text-stone-300" id="hint-answer-${zodiac.id}"></div>

                    <div class="w-full flex flex-col items-center justify-center pt-2">
                        <span class="text-base md:text-lg font-black font-serif text-stone-700 block tracking-wider">${zodiac.chinese}</span>
                        <span class="text-[11px] md:text-xs font-bold text-stone-500 block mt-0.5 tracking-tight font-sans">${zodiac.lomaji}</span>
                    </div>
                `;

                // 綁定拖曳與觸控事件
                slot.addEventListener('dragover', e => { e.preventDefault(); slot.classList.add('drag-over'); });
                slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));
                slot.addEventListener('drop', handleDrop);
                slot.addEventListener('click', () => handleSlotClick(zodiac.id));

                grid.appendChild(slot);
            });

            if(gameState.showAnswersEnabled) showAnswersVisuals();
        }

        // 渲染生肖卡片庫
        function renderCardPool(shuffledList = null) {
            const pool = document.getElementById('card-pool');
            pool.innerHTML = '';

            const unmatched = ZODIAC_DATA.filter(item => !Object.values(gameState.matches).includes(item.id));

            if (unmatched.length === 0) {
                pool.innerHTML = `
                    <div class="w-full md:col-span-3 flex items-center justify-center p-2 text-emerald-800 text-center bg-emerald-50 rounded-lg border border-emerald-200 text-xs font-bold">
                        🎉 全通關囉！
                    </div>
                `;
                return;
            }

            const displayList = shuffledList ? shuffledList : shuffleArray([...unmatched]);

            displayList.forEach(zodiac => {
                const card = document.createElement('div');
                card.id = `card-${zodiac.id}`;
                card.className = `zodiac-card flex-shrink-0 w-16 h-16 md:w-full md:h-auto md:aspect-square bg-white p-1 rounded-xl shadow border border-stone-200 cursor-grab flex flex-col items-center justify-center text-center select-none touch-none`;
                card.draggable = true;
                card.dataset.zodiacId = zodiac.id;
                
                const imageSrc = getImageUrl(zodiac);
                
                card.innerHTML = `
                    <div class="w-9 h-9 flex items-center justify-center overflow-hidden rounded mb-0.5 pointer-events-none">
                        <img src="${imageSrc}" alt="${zodiac.chinese}" class="w-full h-full object-contain" onerror="handleImgError(this, '${zodiac.image}', '${zodiac.emoji}')" />
                        <div class="hidden w-full h-full text-lg items-center justify-center font-bold">${zodiac.emoji}</div>
                    </div>
                    <span class="text-[11px] font-black font-serif text-stone-700 block pointer-events-none leading-none">${zodiac.chinese}</span>
                `;

                // 電腦端滑鼠拖曳
                card.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('text/plain', e.target.dataset.zodiacId);
                    clearMobileSelection();
                });
                
                // 行動裝置手指原生觸控拖曳引擎
                let touchGhost = null;
                let dragActive = false;

                card.addEventListener('touchstart', function(e) {
                    const touch = e.touches[0];
                    gameState.selectedCardId = zodiac.id; 
                    
                    touchGhost = card.cloneNode(true);
                    touchGhost.style.position = 'fixed';
                    touchGhost.style.width = card.offsetWidth + 'px';
                    touchGhost.style.height = card.offsetHeight + 'px';
                    touchGhost.style.opacity = '0.85';
                    touchGhost.style.zIndex = '9999';
                    touchGhost.style.pointerEvents = 'none'; 
                    touchGhost.classList.add('shadow-2xl', 'border-zodiac-red', 'scale-105');
                    
                    updateGhostPosition(touch.clientX, touch.clientY);
                    document.body.appendChild(touchGhost);
                    
                    card.classList.add('opacity-40');
                    dragActive = true;
                }, { passive: true });

                card.addEventListener('touchmove', function(e) {
                    if (!dragActive || !touchGhost) return;
                    const touch = e.touches[0];
                    updateGhostPosition(touch.clientX, touch.clientY);
                    
                    const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
                    const slot = elementUnder ? elementUnder.closest('[data-slot-id]') : null;
                    
                    document.querySelectorAll('[data-slot-id]').forEach(s => s.classList.remove('drag-over'));
                    if (slot && !gameState.matches[slot.dataset.slotId]) {
                        slot.classList.add('drag-over');
                    }
                    
                    if (e.cancelable) e.preventDefault();
                }, { passive: false });

                card.addEventListener('touchend', function(e) {
                    if (!dragActive) return;
                    dragActive = false;
                    card.classList.remove('opacity-40');
                    
                    if (touchGhost) {
                        const touch = e.changedTouches[0];
                        const elementUnder = document.elementFromPoint(touch.clientX, touch.clientY);
                        const slot = elementUnder ? elementUnder.closest('[data-slot-id]') : null;
                        
                        touchGhost.remove();
                        touchGhost = null;
                        document.querySelectorAll('[data-slot-id]').forEach(s => s.classList.remove('drag-over'));
                        
                        if (slot) {
                            const slotId = parseInt(slot.dataset.slotId);
                            processMatch(zodiac.id, slotId, slot);
                        }
                    }
                    clearMobileSelection();
                });

                function updateGhostPosition(x, y) {
                    if (!touchGhost) return;
                    touchGhost.style.left = (x - card.offsetWidth / 2) + 'px';
                    touchGhost.style.top = (y - card.offsetHeight / 2) + 'px';
                }

                card.addEventListener('click', e => { e.stopPropagation(); handleCardClick(zodiac.id); });

                pool.appendChild(card);
            });
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const zodiacId = parseInt(e.dataTransfer.getData('text/plain'));
            const slotId = parseInt(this.dataset.slotId);
            processMatch(zodiacId, slotId, this);
        }

        function handleCardClick(zodiacId) {
            if (Object.values(gameState.matches).includes(zodiacId)) return;
            const prevSelected = document.querySelector('.card-selected');
            if (prevSelected) prevSelected.classList.remove('card-selected');

            if (gameState.selectedCardId === zodiacId) {
                gameState.selectedCardId = null;
            } else {
                gameState.selectedCardId = zodiacId;
                document.getElementById(`card-${zodiacId}`)?.classList.add('card-selected');
            }
        }

        function handleSlotClick(slotId) {
            if (gameState.selectedCardId !== null) {
                const slotElement = document.querySelector(`[data-slot-id="${slotId}"]`);
                processMatch(gameState.selectedCardId, slotId, slotElement);
                clearMobileSelection();
            } else if (gameState.matches[slotId]) {
                playZodiacSound(slotId);
            }
        }

        function clearMobileSelection() {
            gameState.selectedCardId = null;
            document.querySelector('.card-selected')?.classList.remove('card-selected');
        }

        // 核心配對處理
        function processMatch(zodiacId, slotId, slotElement) {
            if (zodiacId === slotId) {
                gameState.matches[slotId] = zodiacId;
                transformSlotToCorrect(slotId, slotElement);
                playMatchChime();
                playZodiacSound(zodiacId);
                renderCardPool();
                updateProgress();

                confetti({ particleCount: 15, spread: 25, origin: { y: 0.8 }, colors: ['#9A1D23', '#D4AF37', '#15803D'] });
                checkVictory();
            } else {
                slotElement.classList.add('shake', 'border-red-500', 'bg-red-50');
                setTimeout(() => slotElement.classList.remove('shake', 'border-red-500', 'bg-red-50'), 400);
            }
        }

        // 配對成功：大尺寸排序圓形徽章 (1-12) + 左下角「頭」「尾」檢索連結
        function transformSlotToCorrect(zodiacId, slotElement) {
            const data = ZODIAC_DATA.find(z => z.id === zodiacId);
            if (!data) return;

            slotElement.className = `relative aspect-[1.1/1] md:aspect-square rounded-xl border-2 border-emerald-600 bg-emerald-50/40 flex flex-col items-center justify-center p-1 text-center transition-all cursor-pointer shadow success-pulse`;
            const imageSrc = getImageUrl(data);

            slotElement.innerHTML = `
                <!-- 💡 卡片左上方標示該生肖的排序數字 (放大調整為 w-6 h-6, 數字為純數大字) 💡 -->
                <div class="absolute top-1 left-1 bg-zodiac-red text-white text-xs md:text-sm font-black w-6 h-6 rounded-full flex items-center justify-center shadow-md select-none">
                    ${data.id}
                </div>
                
                <button class="absolute top-0.5 right-1 w-4 h-4 rounded-full bg-emerald-600 text-white flex items-center justify-center text-[9px] shadow-xs hover:scale-110 transition-transform" onclick="event.stopPropagation(); playZodiacSound(${zodiacId})">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <!-- 💡 左下角「頭」「尾」教育部常用詞辭典檢索連結 💡 -->
                <div class="absolute bottom-1 left-1.5 flex gap-1 z-20" onclick="event.stopPropagation();">
                    <a href="${data.prefixWeb}" target="_blank" class="px-1.5 py-0.5 rounded bg-blue-500 hover:bg-blue-600 text-white text-[9px] font-black tracking-tighter shadow-xs transition-colors flex items-center justify-center" title="教育部辭典：查詢字頭「^${data.chinese}」">
                        頭
                    </a>
                    <a href="${data.suffixWeb}" target="_blank" class="px-1.5 py-0.5 rounded bg-purple-500 hover:bg-purple-600 text-white text-[9px] font-black tracking-tighter shadow-xs transition-colors flex items-center justify-center" title="教育部辭典：查詢字尾「${data.chinese}$」">
                        尾
                    </a>
                </div>

                <!-- 右下角延伸詞入口 -->
                <button class="absolute bottom-0.5 right-0.5 px-1 py-0.5 rounded bg-amber-100 border border-amber-300 text-amber-950 text-[9px] font-black tracking-tighter flex items-center scale-95 hover:scale-105" 
                        onclick="event.stopPropagation(); openExtModal(${zodiacId})">
                    📖詞
                </button>

                <div class="w-full flex flex-col items-center justify-center pt-2 pointer-events-none">
                    <div class="w-8 h-8 flex items-center justify-center overflow-hidden rounded mb-0.5">
                        <img src="${imageSrc}" alt="${data.chinese}" class="w-full h-full object-contain" onerror="handleImgError(this, '${data.image}', '${data.emoji}')" />
                    </div>
                    <span class="text-base md:text-lg font-black font-serif text-emerald-950 block leading-tight">${data.chinese}</span>
                    <span class="text-[11px] md:text-xs font-black text-emerald-800 block tracking-tight font-sans">${data.lomaji}</span>
                </div>

        }

        function playZodiacSound(zodiacId) {
            const item = ZODIAC_DATA.find(z => z.id === zodiacId);
            if (item) playAudioSource(item.audio);
        }

        function playExtSound(zodiacId) {
            const item = ZODIAC_DATA.find(z => z.id === zodiacId);
            if (item) playAudioSource(item.extAudio);
        }

        function playAudioSource(url) {
            const audio = document.getElementById('global-audio');
            audio.src = url;
            audio.play().catch(() => {});
        }

        function playMatchChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99].forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine'; osc.frequency.value = freq;
                    const start = now + (idx * 0.04);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.06, start + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(start); osc.stop(start + 0.25);
                });
            } catch (e) {}
        }

        // Web Audio API 實體物理聲波合成器 (當外部音效檔受瀏覽器安全限制阻擋時，保證通關音樂絕對會響起！)
        function playVictorySynthesizedFanfare() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                
                // 凱旋大三和弦上行琶音
                const notes = [
                    { f: 261.63, d: 0.18, t: 0.0 },  // C4
                    { f: 329.63, d: 0.18, t: 0.12 }, // E4
                    { f: 392.00, d: 0.18, t: 0.24 }, // G4
                    { f: 523.25, d: 0.35, t: 0.36 }, // C5
                    
                    { f: 392.00, d: 0.18, t: 0.6 },  // G4
                    { f: 523.25, d: 0.18, t: 0.72 }, // C5
                    { f: 659.25, d: 0.18, t: 0.84 }, // E5
                    { f: 783.99, d: 0.8,  t: 0.96 }  // G5 (Hold)
                ];

                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle'; 
                    osc.frequency.setValueAtTime(note.f, now + note.t);
                    
                    gain.gain.setValueAtTime(0, now + note.t);
                    gain.gain.linearRampToValueAtTime(0.12, now + note.t + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + note.t + note.d);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(now + note.t);
                    osc.stop(now + note.t + note.d);
                });

                // 物理模擬群眾鼓掌聲
                for (let i = 0; i < 25; i++) {
                    const clapTime = now + 0.3 + (Math.random() * 1.8);
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(90 + Math.random() * 140, clapTime);
                    
                    gain.gain.setValueAtTime(0, clapTime);
                    gain.gain.linearRampToValueAtTime(0.02, clapTime + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, clapTime + 0.1);
                    
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    
                    osc.start(clapTime);
                    osc.stop(clapTime + 0.12);
                }
            } catch (e) {
                console.warn("Victory synthesizer error:", e);
            }
        }

        function updateProgress() {
            const count = Object.keys(gameState.matches).length;
            document.getElementById('score-val').innerText = count;
            document.getElementById('score-val-mobile').innerText = count;
            document.getElementById('progress-bar').style.width = `${(count / 12) * 100}%`;
        }

        // 洗牌算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function shufflePool() {
            const unmatched = ZODIAC_DATA.filter(item => !Object.values(gameState.matches).includes(item.id));
            renderCardPool(shuffleArray([...unmatched]));
            clearMobileSelection();
        }

        function openExtModal(zodiacId) {
            const item = ZODIAC_DATA.find(z => z.id === zodiacId);
            if (!item) return;

            document.getElementById('modal-zodiac-chinese').innerText = item.chinese;
            document.getElementById('modal-zodiac-pron').innerText = `[${item.lomaji}]`;
            document.getElementById('modal-ext-word').innerText = item.extWord;
            document.getElementById('modal-ext-explain').innerText = item.explanation;
            document.getElementById('modal-ext-link').href = item.extWeb;

            const imageSrc = getImageUrl(item);
            document.getElementById('modal-zodiac-img').innerHTML = `
                <img src="${imageSrc}" alt="${item.chinese}" class="w-full h-full object-contain" onerror="handleImgError(this, '${item.image}', '${item.emoji}')" />
            `;

            document.getElementById('modal-zodiac-sound-btn').onclick = () => playZodiacSound(zodiacId);
            document.getElementById('modal-ext-sound-btn').onclick = () => playExtSound(zodiacId);

            const modal = document.getElementById('ext-modal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeExtModal() {
            document.getElementById('ext-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function toggleAnswers() {
            gameState.showAnswersEnabled = !gameState.showAnswersEnabled;
            const button = document.getElementById('show-answers');
            if(gameState.showAnswersEnabled) {
                button.innerHTML = `<i class="fa-solid fa-eye-slash"></i> 藏`;
                showAnswersVisuals();
            } else {
                button.innerHTML = `<i class="fa-regular fa-eye"></i> 填`;
                hideAnswersVisuals();
            }
        }

        function showAnswersVisuals() {
            ZODIAC_DATA.forEach(z => {
                const hintDiv = document.getElementById(`hint-answer-${z.id}`);
                if (hintDiv) {
                    hintDiv.innerText = z.chinese;
                    hintDiv.className = "absolute top-0.5 right-1 text-[10px] font-black text-amber-700 bg-amber-50 px-0.5 rounded border border-amber-200";
                }
            });
        }

        function hideAnswersVisuals() {
            ZODIAC_DATA.forEach(z => {
                const hintDiv = document.getElementById(`hint-answer-${z.id}`);
                if (hintDiv) { hintDiv.innerText = ''; }
            });
        }

        function cheatComplete() {
            ZODIAC_DATA.forEach(zodiac => {
                if(!gameState.matches[zodiac.id]) {
                    gameState.matches[zodiac.id] = zodiac.id;
                    const slotElem = document.querySelector(`[data-slot-id="${zodiac.id}"]`);
                    if(slotElem) transformSlotToCorrect(zodiac.id, slotElem);
                }
            });
            renderCardPool(); updateProgress(); checkVictory();
        }

        // 勝利判定與通關歡呼
        function checkVictory() {
            if (Object.keys(gameState.matches).length === 12) {
                playVictorySynthesizedFanfare();

                const cheerAudio = document.getElementById('victory-cheer-audio');
                cheerAudio.src = "https://actions.google.com/sounds/v1/crowds/cheering_and_applause.ogg";
                cheerAudio.play().catch(e => {
                    console.log("Cheer audio playback delayed by browser autoplay policy.");
                });

                setTimeout(() => {
                    document.getElementById('victory-modal').classList.remove('opacity-0', 'pointer-events-none');
                    const end = Date.now() + 3000;
                    (function frame() {
                        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#9A1D23', '#D4AF37', '#15803D'] });
                        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#9A1D23', '#D4AF37', '#15803D'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                }, 400);
            }
        }

        function closeVictory() {
            document.getElementById('victory-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        function resetGame() {
            gameState.matches = {};
            gameState.selectedCardId = null;
            initGame();
        }
    </script>
</body>
</html>
