<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>臺灣台語十二生相互動學習遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Zen Maru Gothic', sans-serif; background-color: #FDFBF7; }
        .board-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; border: 2px solid #8B4513; border-radius: 12px; padding: 10px; background: #fff; }
        .drop-zone { border: 2px dashed #8B4513; border-radius: 8px; height: 130px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF; position: relative; }
        .card { width: 85px; height: 85px; cursor: grab; object-fit: contain; }
        .card-pool { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    </style>
</head>
<body class="p-6">
    <header class="flex items-center gap-4 mb-6">
        <img src="https://raw.githubusercontent.com/tsong-su/iuhi/main/logo.png" class="w-16 h-16 rounded-full border-4 border-[#D4AF37]">
        <div>
            <h1 class="text-3xl font-black text-[#9A1D23]">臺灣台語十二生相互動學習遊戲</h1>
            <p class="text-stone-600 mt-1">請將生肖拖入正確的【台語配對格】。配對成功後，請點選綠色長框查看延伸詞，有詞頭、詞尾、部分符合可選擇。</p>
        </div>
        <div id="timer" class="ml-auto text-2xl font-bold text-[#9A1D23]">使用：0 秒</div>
    </header>

    <div class="flex gap-8">
        <div class="flex-1">
            <div id="board-grid" class="board-grid"></div>
        </div>

        <div class="w-80 bg-[#EFEBE0] p-5 rounded-2xl border border-stone-300">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-stone-800">生肖卡片庫</h2>
                <button onclick="document.getElementById('song-player').play()" class="bg-[#9A1D23] text-white px-4 py-2 rounded-lg font-bold text-sm shadow">播放全歌謠</button>
            </div>
            <audio id="song-player" src="十二生相1鼠.12豬.mp3"></audio>
            <div id="card-pool" class="card-pool"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/";
        const ZODIAC_DATA = [
            { id: 1, name: "鼠", sound: "tshí", img: "01.鼠.png" },
            { id: 2, name: "牛", sound: "gû", img: "02.牛.png" },
            { id: 3, name: "虎", sound: "hóo", img: "03.虎.png" },
            { id: 4, name: "兔", sound: "thòo", img: "04.兔.png" },
            { id: 5, name: "龍", sound: "lîng", img: "05.龍.png" },
            { id: 6, name: "蛇", sound: "tsuâ", img: "06.蛇.png" },
            { id: 7, name: "馬", sound: "bé", img: "7.馬.png" },
            { id: 8, name: "羊", sound: "iûnn", img: "08.羊.png" },
            { id: 9, name: "猴", sound: "kâu", img: "09.猴.png" },
            { id: 10, name: "雞", sound: "ke", img: "10.雞.png" },
            { id: 11, name: "狗", sound: "káu", img: "11.狗.png" },
            { id: 12, name: "豬", sound: "ti", img: "12.豬.png" }
        ];

        let seconds = 0;
        setInterval(() => { seconds++; document.getElementById('timer').innerText = "使用：" + seconds + " 秒"; }, 1000);

        function init() {
            const grid = document.getElementById('board-grid');
            const pool = document.getElementById('card-pool');
            
            ZODIAC_DATA.forEach(z => {
                const slot = document.createElement('div');
                slot.className = "drop-zone";
                // 使用 encodeURIComponent 確保中文檔名能被正確讀取
                const encodedImg = BASE_URL + encodeURIComponent(z.img);
                
                slot.innerHTML = `<span class="font-bold text-xl">${z.name}</span><span class="text-red-700 font-bold">${z.sound}</span>`;
                slot.ondragover = (e) => e.preventDefault();
                slot.ondrop = (e) => {
                    e.preventDefault();
                    const data = e.dataTransfer.getData("text");
                    e.currentTarget.appendChild(document.getElementById(data));
                };
                grid.appendChild(slot);

                const card = document.createElement('img');
                card.src = encodedImg;
                card.className = "card";
                card.id = "card" + z.id;
                card.draggable = true;
                card.ondragstart = (e) => e.dataTransfer.setData("text", e.target.id);
                pool.appendChild(card);
            });
        }
        init();
    </script>
</body>
</html>
