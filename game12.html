<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺灣台語十二生相互動學習遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F6F4F0; font-family: 'Noto Sans TC', sans-serif; }
        .zodiac-slot { border: 2px dashed #D1D5DB; }
        .drag-over { border-color: #9A1D23; background-color: #FEF2F2; }
    </style>
</head>
<body class="p-4 md:p-6">

    <header class="flex items-center justify-between pb-4 border-b mb-4">
        <div class="flex items-center gap-3">
            <img src="https://raw.githubusercontent.com/tsong-su/iuhi/main/logo.png" alt="Logo" class="w-10 h-10 object-cover rounded-full">
            <h1 class="text-xl font-black text-red-900">臺灣台語十二生相互動學習遊戲</h1>
        </div>
        <div class="flex gap-2">
            <span class="bg-white px-3 py-1 rounded-full text-sm font-bold text-red-700">⏱️ <span id="timer">0</span> 秒</span>
            <button onclick="resetGame()" class="bg-red-700 text-white px-4 py-1 rounded-full text-sm font-bold">重新開始</button>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- 左側：配對區 -->
        <section>
            <p class="text-sm text-gray-600 mb-2 font-bold">拖曳圖片至正確格，成功後點選「詞頭、詞尾、部」查詢：</p>
            <div id="board" class="grid grid-cols-3 md:grid-cols-4 gap-3"></div>
        </section>

        <!-- 右側：卡片庫 -->
        <section>
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-bold text-gray-700">生肖卡片庫</h2>
                <button onclick="playFullSong()" class="bg-green-600 text-white px-3 py-1 rounded-full text-xs font-bold">🎵 聽全歌謠</button>
            </div>
            <div id="pool" class="grid grid-cols-4 gap-2"></div>
        </section>
    </div>

    <audio id="audio-player" class="hidden"></audio>

        let seconds = 0;
        let timer = setInterval(() => { seconds++; document.getElementById('timer').innerText = seconds; }, 1000);

        function resetGame() { location.reload(); }
        function playFullSong() { new Audio(FULL_SONG).play(); }

        function render() {
            const board = document.getElementById('board');
            const pool = document.getElementById('pool');
            board.innerHTML = ""; pool.innerHTML = "";
            DATA.forEach(d => {
                board.innerHTML += `<div class="zodiac-slot h-24 rounded-lg flex flex-col items-center justify-center">${d.name}</div>`;
                pool.innerHTML += `<img src="${IMG_PATH + d.img}" class="w-16 h-16 border rounded cursor-grab" draggable="true" ondragstart="event.dataTransfer.setData('text', '${d.id}')">`;
            });
        }
        render();
    </script>
</body>
</html>
