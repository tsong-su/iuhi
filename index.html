<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lē-gio̍k 老師 ê 互動遊戲大廳</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4; /* 溫馨溫和的淺綠色背景 */
        }
        /* 可愛立體按鈕陰影 */
        .game-card {
            box-shadow: 0 10px 0px #bbf7d0, 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transition: all 0.2s ease-in-out;
        }
        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 0px #bbf7d0, 0 25px 30px -5px rgba(0, 0, 0, 0.15);
        }
        .game-card:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0px #bbf7d0, 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="min-h-screen w-full flex flex-col items-center justify-between p-4 md:p-8 select-none">

    <!-- 頂部標題區 -->
    <div class="text-center my-6 max-w-2xl bg-white/80 border-4 border-emerald-200 p-6 rounded-3xl shadow-sm">
        <span class="text-5xl">🎒</span>
        <h1 class="text-3xl md:text-4xl font-black text-emerald-900 tracking-wide mt-3">Lē-gio̍k 老師 ê 互動遊戲大廳</h1>
        <p class="text-emerald-700 font-bold mt-2 text-sm md:text-base">小朋友，歡迎來到台語學習樂園！點擊下方卡片開始挑戰吧！</p>
    </div>

    <!-- 中間：遊戲選擇卡片區 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl w-full my-6 px-4">
        
        <!-- 遊戲卡片 1：一工 ê 時間軸 -->
        <a href="time-game.html" class="game-card bg-white border-4 border-emerald-300 rounded-3xl p-6 flex flex-col items-center justify-between text-center cursor-pointer min-h-[300px]">
            <div class="text-6xl my-4">⏰</div>
            <div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">一工 ê 時間軸</h2>
                <p class="text-sm text-slate-500 font-bold leading-relaxed">挑戰台語的時間詞配對！搭配精美可愛的生活插圖，看看你幾秒能闖關成功！</p>
            </div>
            <div class="mt-6 px-6 py-2.5 bg-emerald-500 text-white font-black rounded-full shadow hover:bg-emerald-600 transition">
                進入挑戰 ➡️
            </div>
        </a>

        <!-- 遊戲卡片 2：烏龜小測驗 -->
        <a href="turtle-quiz.html" class="game-card bg-white border-4 border-emerald-300 rounded-3xl p-6 flex flex-col items-center justify-between text-center cursor-pointer min-h-[300px]">
            <div class="text-6xl my-4">🐢</div>
            <div>
                <h2 class="text-2xl font-black text-slate-800 mb-2">烏龜小測驗</h2>
                <p class="text-sm text-slate-500 font-bold leading-relaxed">好玩又有趣的烏龜主題測驗！跟著可愛的小烏龜一起動腦筋，快樂學台語！</p>
            </div>
            <div class="mt-6 px-6 py-2.5 bg-emerald-500 text-white font-black rounded-full shadow hover:bg-emerald-600 transition">
                進入挑戰 ➡️
            </div>
        </a>

    </div>

    <!-- 底部版權宣告 -->
    <div class="text-xs text-emerald-800 font-bold bg-white/60 px-4 py-2 rounded-full border border-emerald-100 shadow-inner">
        🦕 Lē-gio̍k 老師專屬台語教材庫
    </div>

</body>
</html>
