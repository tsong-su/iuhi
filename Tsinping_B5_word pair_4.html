<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B5 第 4 課 - 語詞對對碰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.2; }
        }
        .confetti {
            position: fixed; top: -20px; width: 12px; height: 12px; border-radius: 50%;
            animation: fall linear infinite; z-index: 9999; pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-yellow-50 via-rose-50 to-pink-100 min-h-screen p-4 md:p-8 font-sans text-gray-800">
    <div class="max-w-4xl mx-auto space-y-6">
        <header class="bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-lg border border-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://github.com/tsong-su/iuhi/blob/main/logo.png?raw=true" class="w-12 h-12 object-contain" alt="Logo">
                <div>
                    <h1 class="font-extrabold text-lg text-rose-950">B5 第 4 課 - 語詞對對碰</h1>
                    <p class="text-xs text-gray-500">點選圖片卡與文字卡進行配對挑戰</p>
                </div>
            </div>
            <button onclick="initGame()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow transition cursor-pointer">🔄 重新洗牌</button>
        </header>
        <main id="game-container" class="bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-rose-100 space-y-5">
        </main>
    </div>
    <audio id="sfx-win" src="https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/victory2.mp3" preload="auto" class="hidden"></audio>
    <audio id="sfx-wrong" src="https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/wrong.mp3" preload="auto" class="hidden"></audio>
    <script>
        const pairsData = [{"id":1,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_1.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_1.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_1.mp3"},{"id":2,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_2.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_2.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_2.mp3"},{"id":3,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_3.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_3.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_3.mp3"},{"id":4,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_4.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_4.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_4.mp3"},{"id":5,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_5.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_5.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_5.mp3"},{"id":6,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_6.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_6.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_6.mp3"},{"id":7,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_7.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_7.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_7.mp3"},{"id":8,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_8.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_8.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_8.mp3"},{"id":9,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_9.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_9.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_9.mp3"},{"id":10,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_10.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_10.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_10.mp3"},{"id":11,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_11.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_11.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_11.mp3"},{"id":12,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_12.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_12.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_12.mp3"},{"id":13,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_13.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_13.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_13.mp3"},{"id":14,"imgUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_p4_14.png","textUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_w4_14.png","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B5_s4_14.mp3"}];
        let cards = [];
        let firstCard = null;
        let lock = false;
        let matchedCount = 0;
        function initGame() {
            cards = [];
            pairsData.forEach(p => {
                cards.push({ unique: Math.random(), pairId: p.id, type: 'img', url: p.imgUrl, audioUrl: p.audioUrl });
                cards.push({ unique: Math.random(), pairId: p.id, type: 'text', url: p.textUrl, audioUrl: p.audioUrl });
            });
            cards.sort(() => Math.random() - 0.5);
            firstCard = null;
            lock = false;
            matchedCount = 0;
            renderBoard();
        }
        function renderBoard() {
            const container = document.getElementById('game-container');
            if (!container) return;
            container.innerHTML = '<div class="bg-gradient-to-r from-rose-500 via-pink-500 to-red-500 text-white p-4 rounded-3xl shadow-lg flex items-center justify-between"><div><span class="bg-white/20 text-[10px] px-2.5 py-0.5 rounded-full font-bold">語詞對對碰 (正面直顯)</span><div class="text-xs text-pink-100 mt-1">💡 點選一張圖片卡與一張文字卡找出對應的語詞！</div></div><div id="score-board" class="bg-white text-rose-700 px-3 py-1.5 rounded-2xl text-xs font-extrabold shadow">已配對：0 / ' + pairsData.length + '</div></div>' +
                '<div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-3 p-2">' +
                cards.map((card, idx) => '<div onclick="onCardClick(this, ' + card.pairId + ', \'' + card.audioUrl + '\')" class="bg-white border-2 border-rose-200 h-28 rounded-2xl shadow-md flex items-center justify-center p-2 cursor-pointer transition transform hover:scale-105 select-none relative overflow-hidden group"><img src="' + card.url + '" class="max-h-full max-w-full object-contain drop-shadow" onerror="this.src=\'https://placehold.co/100x100/f43f5e/ffffff?text=Card\'"></div>').join('') +
                '</div><div id="game-msg" class="text-xs font-bold min-h-[1.5em] text-center text-rose-600"></div>';
        }
        function onCardClick(el, pairId, audioUrl) {
            if (lock) return;
            if (el.classList.contains('matched') || el === firstCard) return;
            el.classList.add('ring-4', 'ring-rose-400', 'bg-rose-50');
            if (!firstCard) {
                firstCard = { el, pairId, audioUrl };
                return;
            }
            const secondCard = { el, pairId, audioUrl };
            if (firstCard.pairId === secondCard.pairId) {
                const audio = new Audio(secondCard.audioUrl);
                audio.play().catch(e=>{});
                firstCard.el.classList.remove('ring-4', 'ring-rose-400', 'bg-rose-50');
                secondCard.el.classList.remove('ring-4', 'ring-rose-400', 'bg-rose-50');
                firstCard.el.classList.add('matched', 'opacity-50', 'bg-emerald-50', 'border-emerald-400', 'pointer-events-none');
                secondCard.el.classList.add('matched', 'opacity-50', 'bg-emerald-50', 'border-emerald-400', 'pointer-events-none');
                matchedCount++;
                document.getElementById('score-board').innerText = '已配對：' + matchedCount + ' / ' + pairsData.length;
                document.getElementById('game-msg').textContent = "✨ 配對成功！真厲害！";
                firstCard = null;
                if (matchedCount === pairsData.length) {
                    lock = true;
                    audio.onended = () => {
                        setTimeout(() => {
                            const container = document.getElementById('game-container');
                            container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-rose-600 text-white p-8 rounded-3xl shadow-2xl text-center space-y-4"><div class="text-5xl">🏆🎉</div><h3 class="text-2xl font-extrabold text-white">恭喜過關！</h3><p class="text-xs text-pink-100">太棒了！所有語詞你都成功配對囉！</p><button onclick="initGame()" class="px-6 py-3 bg-white text-rose-700 font-extrabold rounded-2xl shadow-md cursor-pointer hover:bg-rose-50 transition">🔄 閣挑戰一擺</button></div>';
                            startConfetti();
                            setTimeout(() => {
                                const win = document.getElementById('sfx-win');
                                if(win) { win.currentTime = 0; win.play().catch(e=>{}); }
                            }, 300);
                        }, 1000);
                    };
                }
            } else {
                lock = true;
                const wrong = document.getElementById('sfx-wrong');
                if(wrong) { wrong.currentTime = 0; wrong.play().catch(e=>{}); }
                document.getElementById('game-msg').textContent = "❌ 毋著喔！再試一擺！";
                setTimeout(() => {
                    firstCard.el.classList.remove('ring-4', 'ring-rose-400', 'bg-rose-50');
                    secondCard.el.classList.remove('ring-4', 'ring-rose-400', 'bg-rose-50');
                    firstCard = null;
                    lock = false;
                    document.getElementById('game-msg').textContent = "";
                }, 800);
            }
        }
        function startConfetti() {
            const colors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#fbbf24'];
            for (let i = 0; i < 70; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                c.style.animationDuration = (Math.random() * 2 + 2) + 's';
                c.style.animationDelay = (Math.random() * 1.5) + 's';
                document.body.appendChild(c);
            }
        }
        window.onload = initGame;
    </script>
</body>
</html>
