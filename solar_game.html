<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二十四節氣郵票拖曳配對遊戲</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: #f7f4ed;
      margin: 0; padding: 20px;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { color: #3e503c; margin-bottom: 8px; font-size: 1.5rem; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 16px; font-size: 0.95rem; }
    .game-container {
      width: 100%; max-width: 750px; background-color: #ffffff;
      border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .stats-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; padding: 10px 16px; background-color: #f0f4ef;
      border-radius: 12px; font-weight: bold; color: #2e402b;
    }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .cards-zone, .stamps-zone { display: flex; flex-direction: column; gap: 12px; }
    .card {
      background-color: #fff8e7; border: 2px dashed #f0a85d; border-radius: 10px;
      padding: 12px; text-align: center; cursor: grab; font-weight: bold; color: #8a4b08;
    }
    .card:active { cursor: grabbing; transform: scale(1.02); }
    .card.matched { display: none; }
    .stamp-slot {
      background-color: #fdfdfd; border: 2px dashed #d1d5db; border-radius: 8px;
      padding: 12px; min-height: 85px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; position: relative;
    }
    .stamp-slot.drag-over { background-color: #eef2ff; border-color: #6366f1; }
    .stamp-slot.correct { border: 2px solid #10b981; background-color: #ecfdf5; }
    .stamp-title { font-size: 1.1rem; font-weight: bold; color: #1f2937; }
    .stamp-hint { font-size: 0.8rem; color: #6b7280; }
    .placed-card {
      margin-top: 6px; padding: 4px 12px; background-color: #10b981;
      color: white; border-radius: 16px; font-size: 0.85rem; font-weight: bold;
    }
    .btn {
      background-color: #4b6b47; color: white; border: none; padding: 8px 18px;
      font-size: 0.9rem; border-radius: 20px; cursor: pointer; font-weight: bold;
    }
    .btn:hover { background-color: #385235; }
  </style>
</head>
<body>

  <h1>二十四節氣郵票拖曳配對遊戲</h1>
  <p class="subtitle">將左側敘述拖曳至右側對應的郵票集郵冊中！</p>

  <div class="game-container">
    <div class="stats-bar">
      <div>得分：<span id="score">0</span> / 4</div>
      <button class="btn" onclick="resetGame()">重新開始</button>
    </div>

    <div class="board">
      <div class="cards-zone" id="cardsZone"></div>
      <div class="stamps-zone" id="stampsZone"></div>
    </div>
  </div>

  <script>
    const quizData = [
      { id: 'spring', title: '🌸 春分', desc: '晝夜平分，大地春暖花開', hint: '三月中旬' },
      { id: 'summer', title: '☀️ 立夏', desc: '萬物生長，宣告夏季開始', hint: '五月上旬' },
      { id: 'autumn', title: '🍁 秋分', desc: '晝夜再次平分，秋收季節', hint: '九月下旬' },
      { id: 'winter', title: '🥣 冬至', desc: '一年中白天最短，習慣吃湯圓', hint: '十二月下旬' }
    ];

    let score = 0;
    let draggedElement = null;

    function initGame() {
      score = 0;
      document.getElementById('score').innerText = score;
      const cardsZone = document.getElementById('cardsZone');
      const stampsZone = document.getElementById('stampsZone');
      cardsZone.innerHTML = '';
      stampsZone.innerHTML = '';

      const shuffledCards = [...quizData].sort(() => Math.random() - 0.5);

      shuffledCards.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.innerText = item.desc;
        card.dataset.id = item.id;

        card.addEventListener('dragstart', (e) => {
          draggedElement = card;
          e.dataTransfer.setData('text/plain', item.id);
        });

        cardsZone.appendChild(card);
      });

      quizData.forEach(item => {
        const slot = document.createElement('div');
        slot.className = 'stamp-slot';
        slot.dataset.id = item.id;
        slot.innerHTML = `<div class="stamp-title">${item.title}</div><div class="stamp-hint">提示：${item.hint}</div>`;

        slot.addEventListener('dragover', (e) => {
          e.preventDefault();
          if (!slot.classList.contains('correct')) slot.classList.add('drag-over');
        });

        slot.addEventListener('dragleave', () => slot.classList.remove('drag-over'));

        slot.addEventListener('drop', (e) => {
          e.preventDefault();
          slot.classList.remove('drag-over');
          const droppedId = e.dataTransfer.getData('text/plain');
          if (droppedId === slot.dataset.id && !slot.classList.contains('correct')) {
            slot.classList.add('correct');
            const matchedCard = quizData.find(q => q.id === droppedId);
            const tag = document.createElement('div');
            tag.className = 'placed-card';
            tag.innerText = matchedCard.desc;
            slot.appendChild(tag);
            draggedElement.classList.add('matched');
            score++;
            document.getElementById('score').innerText = score;
            if (score === quizData.length) setTimeout(() => alert('🎉 恭喜您完成所有節氣配對！'), 200);
          }
        });

        stampsZone.appendChild(slot);
      });
    }

    function resetGame() { initGame(); }
    initGame();
  </script>
</body>
</html>
