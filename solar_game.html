<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二十四節氣互動學習與遊戲網頁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Charis+SIL:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Charis SIL', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif; 
            transition: background-color 0.5s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* 快速順暢 3D 翻牌動畫 */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { 
            transform-style: preserve-3d; 
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: transform;
        }
        .rotate-y-180 { transform: rotateY(180deg); }
        .backface-hidden { 
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden; 
        }

        /* 遊戲動態效果 */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* 四季顏色統一：春(深綠) / 夏(深紅) / 秋(深橘) / 冬(深藍) */
        .season-badge-春 { background-color: #dcfce7; color: #166534; border-color: #4ade80; }
        .season-badge-夏 { background-color: #fee2e2; color: #991b1b; border-color: #f87171; }
        .season-badge-秋 { background-color: #ffedd5; color: #9a3412; border-color: #fb923c; }
        .season-badge-冬 { background-color: #dbeafe; color: #1e40af; border-color: #60a5fa; }

        /* 自訂隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-amber-50">
    <div id="root"></div>

    <script type="text/babel">
        const GITHUB_ASSET_BASE = "https://raw.githubusercontent.com/tsong-su/iuhi/main/solar_terms_assets/";
        const getStampUrl = (imgName) => `${GITHUB_ASSET_BASE}${imgName}?v=2`;
        const LOGO_URL = "https://raw.githubusercontent.com/tsong-su/iuhi/main/logo.png";
        
        const EXTERNAL_WRONG_SOUND = "https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/wrong.mp3";
        const EXTERNAL_VICTORY_SOUND = "https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/victory1.mp3";
        
        // 全域音檔快取與播放器
        const audioCache = {};
        const playAudio = (url) => {
            if (!url) return;
            try {
                if (!audioCache[url]) {
                    audioCache[url] = new Audio(url);
                }
                const audio = audioCache[url];
                audio.currentTime = 0;
                audio.play().catch(e => console.log("音檔播放提示：", e));
            } catch (e) {
                console.log("音檔初始化錯誤", e);
            }
        };

        // 放置成功提示音
        const playSuccessChime = () => {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.08); // A5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}
        };

        const playWrongSound = () => {
            playAudio(EXTERNAL_WRONG_SOUND);
        };

        // 配對/排序通關歡慶勝利音效
        const playVictorySound = () => {
            playAudio(EXTERNAL_VICTORY_SOUND);
        };

        // 學生跟讀錄音與播放組件
        const AudioRecorder = () => {
            const [isRecording, setIsRecording] = React.useState(false);
            const [audioUrl, setAudioUrl] = React.useState(null);
            const [micError, setMicError] = React.useState(null);
            const mediaRecorderRef = React.useRef(null);
            const audioChunksRef = React.useRef([]);
            const mimeTypeRef = React.useRef('');

            const startRecording = async () => {
                setMicError(null);
                try {
                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        setMicError('您的瀏覽器不支援錄音（建議改用 Safari 原生瀏覽器開啟）。');
                        return;
                    }

                    // 智慧檢測 iOS / Safari / Android 支援的錄音格式
                    const types = ['audio/mp4', 'audio/aac', 'audio/webm;codecs=opus', 'audio/webm', 'audio/wav'];
                    let selectedType = '';
                    if (window.MediaRecorder && MediaRecorder.isTypeSupported) {
                        for (const t of types) {
                            if (MediaRecorder.isTypeSupported(t)) {
                                selectedType = t;
                                break;
                            }
                        }
                    }
                    mimeTypeRef.current = selectedType;

                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const options = selectedType ? { mimeType: selectedType } : undefined;
                    
                    mediaRecorderRef.current = new MediaRecorder(stream, options);
                    audioChunksRef.current = [];

                    mediaRecorderRef.current.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data);
                    };

                    mediaRecorderRef.current.onstop = () => {
                        const blobType = mimeTypeRef.current || (audioChunksRef.current[0] && audioChunksRef.current[0].type) || 'audio/mp4';
                        const audioBlob = new Blob(audioChunksRef.current, { type: blobType });
                        const url = URL.createObjectURL(audioBlob);
                        setAudioUrl(url);
                        
                        // 關閉麥克風串流，節省系統資源
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorderRef.current.start();
                    setIsRecording(true);
                } catch (err) {
                    console.error("麥克風存取失敗：", err);
                    setMicError('請允許網站存取麥克風，或用 Safari 開啟。');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                }
            };

            const playMyAudio = () => {
                if (audioUrl) {
                    const audio = new Audio();
                    audio.src = audioUrl;
                    audio.play().catch(e => console.log("播放錄音失敗：", e));
                }
            };

            return (
                <div className="flex flex-col items-center justify-center w-full my-1.5">
                    <div className="flex flex-wrap items-center justify-center gap-1.5 bg-amber-500/20 p-2 rounded-2xl border border-amber-300/40 w-full text-xs font-bold">
                        {!isRecording ? (
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    startRecording();
                                }}
                                className="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md active:scale-95 transition-all text-xs"
                            >
                                🎙️ 錄音跟讀練習
                            </button>
                        ) : (
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    stopRecording();
                                }}
                                className="bg-amber-600 text-white px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md animate-pulse active:scale-95 transition-all text-xs"
                            >
                                ⏹️ 停止錄音
                            </button>
                        )}

                        {audioUrl && !isRecording && (
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    playMyAudio();
                                }}
                                className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-full flex items-center gap-1 shadow-md active:scale-95 transition-all text-xs"
                            >
                                🎧 聽我的錄音
                            </button>
                        )}
                    </div>

                    {micError && (
                        <div 
                            onClick={(e) => e.stopPropagation()} 
                            className="mt-1 text-[11px] bg-rose-100 text-rose-800 border border-rose-300 px-2.5 py-1 rounded-xl text-center font-extrabold w-full"
                        >
                            ⚠️ {micError}
                        </div>
                    )}
                </div>
            );
        };

            const [isGameWon, setIsGameWon] = React.useState(false);

            const [isTimerRunning, setIsTimerRunning] = React.useState(false);
            const [hasStarted, setHasStarted] = React.useState(false);

            React.useEffect(() => {
                let interval = null;
                if (isTimerRunning && !isGameWon) {
                    interval = setInterval(() => {
                        setSeconds(s => s + 1);
                    }, 1000);
                } else {
                    clearInterval(interval);
                }
                return () => clearInterval(interval);
            }, [isTimerRunning, isGameWon]);

            const handleStartGame = () => {
                setHasStarted(true);
                setIsTimerRunning(true);

            const ensureGameStarted = () => {
                if (!hasStarted) {
                    setHasStarted(true);
                    setIsTimerRunning(true);
                }
            };

            const formatTime = (totalSecs) => {
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const formatTimeChinese = (totalSecs) => {
                const mins = Math.floor(totalSecs / 60);
                const secs = totalSecs % 60;
                if (mins > 0) {
                    return `${mins} 分 ${secs} 秒`;
                }
                return `${secs} 秒`;
            };

            // 尚未擺放的郵票清單
            const unplacedStamps = solarTermsData.filter(item => !Object.values(placedMap).some(p => p.id === item.id));

                if (!selectedStamp) return;
                ensureGameStarted();

                        const next = { ...prev, [targetOrder]: selectedStamp };

                            setIsGameWon(true);
                            setIsTimerRunning(false);
                            playVictorySound();
                        } else {

                        }
                        return next;

                    playAudio(selectedStamp.audio);
                    setSelectedStamp(null);

                    setWrongSlot(targetOrder);

                        >
                            🔄 重新排序
                        </button>
                    </div>

                    <div className="flex flex-col lg:flex-row items-center justify-center gap-6 w-full max-w-6xl">
                        {/* 24節氣四季彩虹圓環圖 */}
                        <div className="relative flex items-center justify-center">
                            <div className="w-[340px] h-[340px] sm:w-[480px] sm:h-[480px] bg-gradient-to-br from-amber-50 via-white to-orange-50 rounded-full border-8 border-amber-300 p-2 shadow-2xl flex items-center justify-center relative">
                                <svg viewBox={`0 0 ${size} ${size}`} className="w-full h-full">
                                    {/* 四季底色弧形背景環 */}
                                    <path d={`M ${center} ${center - radius} A ${radius} ${radius} 0 0 1 ${center + radius} ${center}`} fill="none" stroke="#4ade80" strokeWidth="22" opacity="0.35" />
                                    <path d={`M ${center + radius} ${center} A ${radius} ${radius} 0 0 1 ${center} ${center + radius}`} fill="none" stroke="#f87171" strokeWidth="22" opacity="0.35" />
                                    <path d={`M ${center} ${center + radius} A ${radius} ${radius} 0 0 1 ${center - radius} ${center}`} fill="none" stroke="#fb923c" strokeWidth="22" opacity="0.35" />
                                    <path d={`M ${center - radius} ${center} A ${radius} ${radius} 0 0 1 ${center} ${center - radius}`} fill="none" stroke="#60a5fa" strokeWidth="22" opacity="0.35" />

                                    {/* 24 個插槽節點 */}
                                    {solarTermsData.map((item, index) => {
                                        const order = item.order;
                                        const angle = (index * (360 / 24)) - 90;
                                        const radians = (angle * Math.PI) / 180;
                                        const x = center + radius * Math.cos(radians);
                                        const y = center + radius * Math.sin(radians);
                                        
                                        const placedItem = placedMap[order];
                                        const isWrong = wrongSlot === order;
                                        const seasonStyle = seasonColors[item.season];

                                        return (
                                            <g 
                                                key={`sort-slot-${order}`} 
                                                onClick={() => handleSlotClick(order)}
                                                className="cursor-pointer group"
                                            >
                                                <line x1={center} y1={center} x2={x} y2={y} stroke="#fcd34d" strokeWidth="1.5" strokeDasharray="3 3" />

                                                {/* 插槽實體圈 */}
                                                <circle 
                                                    cx={x} 
                                                    cy={y} 
                                                    r={placedItem ? 18 : 14} 
                                                    fill={placedItem ? seasonStyle.bg : (isWrong ? '#f87171' : '#ffffff')}
                                                    stroke={isWrong ? '#ef4444' : seasonStyle.stroke}
                                                    strokeWidth={isWrong ? 4 : (placedItem ? 3 : 2)}
                                                    className="transition-all duration-200"
                                                />

                                                {/* 內容呈現：若擺放成功顯示郵票文字，否則顯示序號 */}
                                                <text 
                                                    x={x} 
                                                    y={y} 
                                                    textAnchor="middle" 
                                                    dominantBaseline="middle" 
                                                    fontSize={placedItem ? "11" : "10"} 
                                                    fontWeight="900"
                                                    fill={placedItem ? "#ffffff" : seasonStyle.text}
                                                >
                                                    {placedItem ? placedItem.term.substring(0, 1) : order}
                                                </text>

                                                {/* 標籤 */}
                                                {(() => {
                                                    const labelRadius = radius + 28;
                                                    const lx = center + labelRadius * Math.cos(radians);
                                                    const ly = center + labelRadius * Math.sin(radians);
                                                    return (
                                                        <text 
                                                            x={lx} 
                                                            y={ly} 
                                                            textAnchor="middle" 
                                                            dominantBaseline="middle" 
                                                            fontSize="10"
                                                            fontWeight="bold"
                                                            fill={placedItem ? seasonStyle.text : "#94a3b8"}
                                                        >
                                                            {placedItem ? placedItem.term : `${order}.${item.term}`}
                                                        </text>
                                                    );
                                                })()}
                                            </g>
                                        );
                                    })}

                                    {/* 圓心大標題 */}
                                    <circle cx={center} cy={center} r="60" fill="#ffffff" stroke="#f59e0b" strokeWidth="4" className="shadow-lg" />
                                    <text x={center} y={center - 12} textAnchor="middle" dominantBaseline="middle" className="text-xs fill-amber-700 font-black">
                                        二十四節氣
                                    </text>
                                    <text x={center} y={center + 12} textAnchor="middle" dominantBaseline="middle" className="text-base font-black fill-amber-900">
                                        圓環排序遊戲
                                    </text>
                                </svg>
                            </div>
                        </div>

                        {/* 未擺放郵票備選卡片區 (附季節篩選) */}
                        <div className="w-full max-w-lg bg-amber-50/80 rounded-3xl p-4 border-4 border-amber-200 shadow-inner flex flex-col">
                            <div className="flex items-center justify-between mb-3">
                                <span className="font-extrabold text-amber-900 text-sm flex items-center gap-1">
                                    📮 待擺放節氣郵票庫 ({filteredUnplaced.length})
                                </span>
                                
                                {/* 季節分類按鈕 */}
                                <div className="flex bg-white rounded-full p-1 border border-amber-200 text-xs font-bold gap-1">
                                    {['全部', '春', '夏', '秋', '冬'].map(s => (
                                        <button 
                                            key={`filter-${s}`}
                                            onClick={() => setFilterSeason(s)}
                                            className={`px-2.5 py-1 rounded-full transition-all ${filterSeason === s ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                                        >
                                            {s}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <p className="text-xs text-amber-800 font-bold mb-3 bg-amber-200/60 p-2 rounded-xl text-center">
                                💡 提示：點擊郵票卡選取後，再點選圓環對應位置即可擺入！
                            </p>
                                            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2.5 max-h-[320px] overflow-y-auto no-scrollbar p-1">
                                {filteredUnplaced.map(item => {
                                    const isSelected = selectedStamp?.id === item.id;
                                    return (
                                        <div 
                                            key={`unplaced-${item.id}`}
                                            onClick={() => {
                                                ensureGameStarted();
                                                setSelectedStamp(item);
                                                playAudio(item.audio);
                                            }}
                                            className={`
                                                bg-white rounded-2xl p-2 border-2 flex flex-col items-center justify-between cursor-pointer transition-all shadow-sm
                                                ${isSelected ? 'border-amber-500 ring-4 ring-amber-300 scale-105 bg-amber-100' : 'border-amber-200 hover:border-amber-400 hover:scale-102'}
                                            `}
                                        >
                                            <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-full border ${'season-badge-' + item.season}`}>
                                                {item.season}季 · 第{item.order}
                                            </span>
                                            <div className="w-full h-16 flex items-center justify-center my-1">
                                                <img 
                                                    src={getStampUrl(item.img)} 
                                                    alt={item.term} 
                                                    className="object-contain max-h-full max-w-full drop-shadow-sm"
                                                    onError={(e) => { e.target.src = `https://placehold.co/100x120/eeeeee/999999?text=${item.term}`; }}
                                                />
                                            </div>
                                            <span className="text-xs font-black text-slate-800">{item.term}</span>
                                        </div>
                                    );
                                })}

                                {filteredUnplaced.length === 0 && (
                                    <div className="col-span-full py-8 text-center text-amber-800/60 font-black text-sm">
                                        🎉 此分類郵票已全部成功排入圓環！
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* 通關勝利彈窗 */}
                    {isGameWon && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 animate-pop">
                                <div className="text-5xl mb-2">🎉🏵️🎉</div>
                                <h3 className="text-2xl font-black text-amber-900 mb-2">恭喜完成 24 節氣圓滿排序！</h3>
                                <p className="text-sm font-bold text-slate-600 mb-3">
                                    太厲害了！您已經將二十四節氣順序全數正確歸位！
                                </p>
                                <div className="bg-amber-100 border-2 border-amber-300 text-amber-900 font-black rounded-2xl py-2.5 px-4 mb-5 text-sm sm:text-base">
                                    ⏱️ 總共花費時間：<span className="text-rose-600 font-black text-lg ml-1">{formatTimeChinese(seconds)}</span>
                                </div>
                                <button 
                                    onClick={resetGame}
                                    className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 text-white font-black py-3 rounded-2xl shadow-lg transition-all text-base"
                                >
                                    🎮 再挑戰一次
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MatchMode = ({ seasonData }) => {
            const [cards, setCards] = React.useState([]);
            const [selectedCards, setSelectedCards] = React.useState([]);
            const [matchedPairs, setMatchedPairs] = React.useState([]);
            const [isChecking, setIsChecking] = React.useState(false);
            const [score, setScore] = React.useState(0);
            const [isGameWon, setIsGameWon] = React.useState(false);

            const initGame = () => {
                const gameCards = [];
                seasonData.forEach(item => {
                    gameCards.push({
                        instanceId: `stamp-${item.id}`,
                        termId: item.id,
                        type: 'stamp',
                        term: item.term,
                        img: item.img,
                        audio: item.audio
                    });
                    gameCards.push({
                        instanceId: `pinyin-${item.id}`,
                        termId: item.id,
                        type: 'pinyin',
                        term: item.term,
                        pinyin: item.pinyin,
                        audio: item.audio
                    });
                });

                const shuffled = gameCards.sort(() => Math.random() - 0.5);
                setCards(shuffled);
                setSelectedCards([]);
                setMatchedPairs([]);
                setScore(0);
                setIsGameWon(false);
            };

            React.useEffect(() => {
                initGame();
            }, [seasonData]);

            const handleCardClick = (card) => {
                if (isChecking) return;
                if (selectedCards.some(c => c.instanceId === card.instanceId)) return;
                if (matchedPairs.includes(card.termId)) return;

                // 只有點擊拼音卡時播放語音，點擊郵票卡保持安靜
                if (card.type === 'pinyin') {
                    playAudio(card.audio);
                }

                const newSelected = [...selectedCards, card];
                setSelectedCards(newSelected);

                if (newSelected.length === 2) {
                    setIsChecking(true);
                    const [first, second] = newSelected;

                    if (first.termId === second.termId && first.type !== second.type) {
                        // 配對成功：再次播放節氣語音朗讀，加深記憶
                        playAudio(first.audio);
                        
                        setTimeout(() => {
                            setMatchedPairs(prev => {
                                const updated = [...prev, first.termId];
                                if (updated.length === seasonData.length) {
                                    setIsGameWon(true);
                                    playVictorySound();
                                }
                                return updated;
                            });
                            setSelectedCards([]);
                            setIsChecking(false);
                            setScore(s => s + 100);
                        }, 300);
                    } else {
                        playWrongSound();
                        setTimeout(() => {
                            setSelectedCards([]);
                            setIsChecking(false);
                        }, 700);
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full">
                    {/* 遊戲資訊頂欄 */}
                    <div className="w-full max-w-4xl bg-gradient-to-r from-amber-400 via-orange-400 to-rose-400 p-3 sm:p-4 rounded-2xl shadow-lg flex items-center justify-between mb-2 border-2 border-white text-white">
                        <div className="flex items-center gap-2 sm:gap-4 font-black text-sm sm:text-base">
                            <span className="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full border border-white/40">
                                ⭐ 成功配對：{matchedPairs.length} / {seasonData.length}
                            </span>
                            <span className="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full border border-white/40">
                                🎯 得分：{score}
                            </span>
                        </div>
                        <button 
                            onClick={initGame}
                            className="bg-white text-amber-800 hover:bg-amber-100 font-black px-4 py-1.5 rounded-full text-xs sm:text-sm shadow-md active:scale-95 transition-all"
                        >
                            🔄 重新玩此季
                        </button>
                    </div>

                    {/* 遊戲操作說明標示 */}
                    <div className="w-full max-w-4xl bg-amber-100/90 text-amber-900 border-2 border-amber-300 font-extrabold text-xs sm:text-sm px-4 py-2 rounded-xl mb-4 text-center shadow-sm">
                        💡 遊戲說明：先點選拼音卡聽音檔發音，再點選相對應的節氣郵票卡進行配對！
                    </div>

                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2.5 sm:gap-3 w-full max-w-5xl">
                        {cards.map((card) => {
                            const isSelected = selectedCards.some(c => c.instanceId === card.instanceId);
                            const isMatched = matchedPairs.includes(card.termId);

                            return (
                                <div
                                    key={card.instanceId}
                                    onClick={() => handleCardClick(card)}
                                    className={`
                                        h-36 sm:h-44 rounded-2xl cursor-pointer p-2 flex flex-col items-center justify-between transition-all duration-200 border-4 shadow-md
                                        ${isMatched ? 'bg-emerald-100 border-emerald-400 opacity-60 pointer-events-none scale-95' : ''}
                                        ${isSelected ? 'bg-amber-200 border-amber-500 scale-105 shadow-xl' : ''}
                                        ${!isSelected && !isMatched ? 'bg-white hover:bg-amber-50 border-amber-200 hover:border-amber-400 hover:scale-105' : ''}
                                    `}
                                >
                                    {card.type === 'stamp' ? (
                                        <div className="w-full h-full flex flex-col items-center justify-between">
                                            <span className="text-[10px] font-black text-amber-800 bg-amber-100 px-2 py-0.5 rounded-full">🖼️ 郵票卡</span>
                                            <div className="w-full h-24 sm:h-28 flex items-center justify-center p-1">
                                                <img 
                                                    src={getStampUrl(card.img)} 
                                                    alt={card.term} 
                                                    className="object-contain max-h-full max-w-full drop-shadow-sm"
                                                    onError={(e) => { e.target.src = `https://placehold.co/150x200/eeeeee/999999?text=${card.term}`; }}
                                                />
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="w-full h-full flex flex-col items-center justify-between py-2 px-1">
                                            <span className="text-[10px] sm:text-[11px] font-black text-sky-800 bg-sky-100 px-2 py-0.5 rounded-full">🔤 拼音卡</span>
                                            <div className="text-center my-auto w-full px-1 flex flex-col items-center justify-center overflow-hidden">
                                                <p className="text-[11px] sm:text-xs md:text-sm lg:text-base font-extrabold text-amber-900 font-mono tracking-tight leading-none whitespace-nowrap">
                                                    {card.pinyin}
                                                </p>
                                            </div>
                                            <span className="text-[10px] font-bold text-slate-400">🔊 點擊聽發音</span>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {isGameWon && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-amber-400 animate-pop">
                                <div className="text-5xl mb-2">🎉🏆🎉</div>
                                <h3 className="text-2xl font-black text-amber-900 mb-2">太棒了！挑戰成功！</h3>
                                <p className="text-sm font-bold text-slate-600 mb-6">
                                    您已經順利完成【{seasonData[0]?.season}季】全部節氣郵票與拼音配對！
                                </p>
                                <button 
                                    onClick={initGame}
                                    className="w-full bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 text-white font-black py-3 rounded-2xl shadow-lg transition-all text-base"
                                >
                                    🎮 再玩一次
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = React.useState('learn');
            const [season, setSeason] = React.useState('春');
            const [activeTermId, setActiveTermId] = React.useState(1);
            
            const seasons = ['春', '夏', '秋', '冬'];
            const currentSeasonData = solarTermsData.filter(item => item.season === season);

            const handleSelectTerm = (term) => {
                setActiveTermId(term.id);
                if (term.season !== season) {
                    setSeason(term.season);
                }
            };

            const seasonBgStyles = {
                '春': 'from-green-200 via-emerald-100 to-teal-100',
                '夏': 'from-red-200 via-rose-100 to-pink-100',
                '秋': 'from-orange-200 via-amber-100 to-yellow-100',
                '冬': 'from-blue-200 via-sky-100 to-cyan-100'
            };

            const seasonBtnThemes = {
                '春': 'bg-green-600 text-white shadow-green-200',
                '夏': 'bg-red-600 text-white shadow-red-200',
                '秋': 'bg-orange-600 text-white shadow-orange-200',
                '冬': 'bg-blue-600 text-white shadow-blue-200'
            };

            return (
                <div className={`min-h-screen pb-16 bg-gradient-to-br ${seasonBgStyles[season]} transition-colors duration-500`}>
                    <header className="bg-white/95 text-slate-800 shadow-md sticky top-0 z-50 border-b-4 border-amber-300">
                        <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-col md:flex-row items-center justify-between gap-2.5">
                            <div className="flex items-center gap-3">
                                <img 
                                    src={LOGO_URL} 
                                    alt="Logo" 
                                    className="h-10 sm:h-12 w-auto object-contain bg-amber-100 p-1 rounded-2xl border-2 border-amber-300 shadow-sm"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                />
                                <h1 className="text-xl sm:text-2xl font-black bg-gradient-to-r from-amber-600 via-orange-500 to-rose-500 bg-clip-text text-transparent tracking-wide">
                                    二十四節氣互動學習網頁
                                </h1>
                            </div>
                            
                            {/* 四大模式切換按鈕 */}
                            <div className="flex bg-amber-100 p-1.5 rounded-full gap-1 border-2 border-amber-300 shadow-inner flex-wrap justify-center">
                                <button 
                                    onClick={() => setMode('learn')}
                                    className={`px-3 py-1.5 rounded-full font-black text-xs sm:text-sm transition-all ${mode === 'learn' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md scale-105' : 'text-slate-700 hover:text-slate-900'}`}
                                >
                                    📖 翻牌時間軸
                                </button>
                                <button 
                                    onClick={() => setMode('wheel')}
                                    className={`px-3 py-1.5 rounded-full font-black text-xs sm:text-sm transition-all ${mode === 'wheel' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md scale-105' : 'text-slate-700 hover:text-slate-900'}`}
                                >
                                    ⭕ 節氣圓環圖
                                </button>
                                <button 
                                    onClick={() => setMode('sort')}
                                    className={`px-3 py-1.5 rounded-full font-black text-xs sm:text-sm transition-all ${mode === 'sort' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md scale-105' : 'text-slate-700 hover:text-slate-900'}`}
                                >
                                    🎯 圓環排序遊戲
                                </button>
                                <button 
                                    onClick={() => setMode('match')}
                                    className={`px-3 py-1.5 rounded-full font-black text-xs sm:text-sm transition-all ${mode === 'match' ? 'bg-gradient-to-r from-amber-500 to-orange-500 text-white shadow-md scale-105' : 'text-slate-700 hover:text-slate-900'}`}
                                >
                                    🎮 拼音配對
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-3 sm:px-4 mt-4 flex flex-col items-center">
                        
                        {/* 季節選擇按鈕 */}
                        {(mode === 'learn' || mode === 'match') && (
                            <div className="flex gap-2 sm:gap-3 mb-4 bg-white/90 p-2 rounded-2xl shadow-md border-2 border-amber-300">
                                {seasons.map(s => {
                                    const isSelected = season === s;
                                    return (
                                        <button
                                            key={s}
                                            onClick={() => {
                                                setSeason(s);
                                                const firstTerm = solarTermsData.find(item => item.season === s);
                                                if (firstTerm) setActiveTermId(firstTerm.id);
                                            }}
                                            className={`px-5 sm:px-8 py-2 rounded-xl font-black text-sm sm:text-lg transition-all
                                                ${isSelected 
                                                    ? `${seasonBtnThemes[s]} shadow-lg scale-105 border-2 border-white` 
                                                    : 'bg-amber-50 text-slate-700 hover:bg-amber-100 border border-amber-200'
                                                }
                                            `}
                                        >
                                            {s}季
                                        </button>
                                    );
                                })}
                            </div>
                        )}

                        <div className="w-full bg-white/70 p-3 sm:p-5 rounded-3xl shadow-md border-4 border-white">
                            {mode === 'learn' && (
                                <LearnMode 
                                    seasonData={currentSeasonData} 
                                    activeId={activeTermId}
                                    onSelectTerm={handleSelectTerm}
                                />
                            )}
                            {mode === 'wheel' && <WheelMode />}
                            {mode === 'sort' && <SortWheelMode />}
                            {mode === 'match' && <MatchMode seasonData={currentSeasonData} key={`match-${season}`} />}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
