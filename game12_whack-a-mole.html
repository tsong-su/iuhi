<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>十二生相台語拍鼢鼠(phah bùn-tshí)</title>
  
  <!-- 載入 React 與 ReactDOM (18版本) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel 用於瀏覽器即時解析 JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin></script>
  
  <!-- 載入 Tailwind CSS (3版本) 實現活潑漸層視覺 -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* 煙火與紙屑落下的動畫效果 */
    @keyframes fall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
      }
    }
    .animate-fall {
      animation: fall 3s linear infinite;
    }
  </style>
</head>
<body class="m-0 p-0 overflow-x-hidden">

  <!-- React 掛載點 -->
  <div id="root"></div>

  <!-- React 應用程式本體 -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 12生肖完整資料庫：包含中文字、台語拼音、對應的表情符號 fallback、教育部台語音檔網址、以及精準的圖片檔名 (含中文)
    const ZODIAC_DATA = [
      { id: 1, name: '鼠', pinyin: 'tshí', emoji: '🐭', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/10/10356.mp3', filename: '01.鼠.png' },
      { id: 2, name: '牛', pinyin: 'gû', emoji: '🐮', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/1/1218.mp3', filename: '02.牛.png' },
      { id: 3, name: '虎', pinyin: 'hóo', emoji: '🐯', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/4/4482.mp3', filename: '03.虎.png' },
      { id: 4, name: '兔', pinyin: 'thòo', emoji: '🐰', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/3/3581.mp3', filename: '04.兔.png' },
      { id: 5, name: '龍', pinyin: 'lîng', emoji: '🐉', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/12/12091.mp3', filename: '05.龍.png' },
      { id: 6, name: '蛇', pinyin: 'tsuâ', emoji: '🐍', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/7/7818.mp3', filename: '06.蛇.png' },
      { id: 7, name: '馬', pinyin: 'bé', emoji: '🐴', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/6/6798.mp3', filename: '07.馬.png' },
      { id: 8, name: '羊', pinyin: 'iûnn', emoji: '🐑', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/2/2588.mp3', filename: '08.羊.png' },
      { id: 9, name: '猴', pinyin: 'kâu', emoji: '🐵', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/8/8571.mp3', filename: '09.猴.png' },
      { id: 10, name: '雞', pinyin: 'ke', emoji: '🐔', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/12/12657.mp3', filename: '10.雞.png' },
      { id: 11, name: '狗', pinyin: 'káu', emoji: '🐶', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/4/4329.mp3', filename: '11.狗.png' },
      { id: 12, name: '豬', pinyin: 'ti', emoji: '🐷', audio: 'https://sutian.moe.edu.tw/media/senn/mp3/imtong/subak/11/11384.mp3', filename: '12.豬.png' }
    ];

    const DEFAULT_IMG_BASE_URL = 'https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/';
    const LOGO_URL = 'https://raw.githubusercontent.com/tsong-su/iuhi/main/logo.png';
    const CONTINUOUS_AUDIO_URL = 'https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/%E5%8D%81%E4%BA%8C%E7%94%9F%E7%9B%B81%E9%BC%A0.12%E8%B1%AC.mp3';

    // 6種精美打擊法寶道具清單 (使用您提供的實體圖卡檔名)
    const WEAPONS = [
      { id: 'lollipop', filename: 'Lollipop.png', name: '棒棒糖' },
      { id: 'chicken_leg', filename: 'Bangbang legs.png', name: '棒棒腿' },
      { id: 'bat', filename: 'bat.png', name: '球棒' },
      { id: 'boxing', filename: 'boxing gloves.png', name: '拳擊手套' },
      { id: 'wand', filename: 'magic wand.png', name: '魔法棒' },
      { id: 'hammer', filename: 'Soft-Face Hammer.png', name: '軟面鎚' }
    ];

    function App() {
      const [gameState, setGameState] = useState('START'); // START, PLAYING, LEVEL_WON, GAME_OVER, CELEBRATING, CHAMPION
      const [level, setLevel] = useState(1);
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(30);
      const [imgBaseUrl, setImgBaseUrl] = useState(DEFAULT_IMG_BASE_URL);
      
      // 紀錄各關卡花費時間 (各關起始 30 秒)
      const [levelTimes, setLevelTimes] = useState({ 1: 0, 2: 0, 3: 0 });
      
      // 目前選擇的打擊道具 (預設使用第一個：棒棒糖)
      const [selectedWeapon, setSelectedWeapon] = useState(WEAPONS[0]);
      
      // 9個地鼠洞的狀態
      const [holes, setHoles] = useState(Array(9).fill(null));
      // 記錄被擊中的生肖，用來顯示打擊特效
      const [hitEffects, setHitEffects] = useState([]);
      
      // 記錄圖片失敗次數做 fallback
      const [imageFailCounter, setImageFailCounter] = useState({});

      // 關卡難度參數定義
      const levelSettings = {
        1: { targetScore: 10, stayDuration: 2000, spawnInterval: 1200, maxActive: 2 },
        2: { targetScore: 12, stayDuration: 1500, spawnInterval: 900, maxActive: 3 },
        3: { targetScore: 15, stayDuration: 1100, spawnInterval: 650, maxActive: 4 }
      };

      const [soundVolume, setSoundVolume] = useState(0.8);
      const continuousAudioRef = useRef(null);
      const [isPlayingContinuous, setIsPlayingContinuous] = useState(false);
      
      // 利用 DOM Ref 繞過 React 的 state 渲染，讓游標移動達到流暢の 0ms 延遲
      const boardRef = useRef(null);
      const cursorRef = useRef(null);
      const cursorInnerRef = useRef(null);

      // 冠軍畫面七彩紙屑煙火效果
      const [confetti, setConfetti] = useState([]);
      const [logoLoadError, setLogoLoadError] = useState(false);
      
      // 皇冠與獎盃的多重尋路加載狀態
      const [crownImgSrc, setCrownImgSrc] = useState('https://raw.githubusercontent.com/tsong-su/iuhi/main/whackamole_assets/crown.png');
      const [crownAttempt, setCrownAttempt] = useState(0);
      const [crownLoadError, setCrownLoadError] = useState(false);

      const [trophyImgSrc, setTrophyImgSrc] = useState('https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/trophy.png');
      const [trophyAttempt, setTrophyAttempt] = useState(0);
      const [trophyLoadError, setTrophyLoadError] = useState(false);

      useEffect(() => {
        let timerInterval;
        let spawnInterval;

        if (gameState === 'PLAYING') {
          timerInterval = setInterval(() => {
            setTimeLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timerInterval);
                clearInterval(spawnInterval);
                checkLevelEnd();
                return 0;
              }
              return prev - 1;
            });
          }, 1000);

          const settings = levelSettings[level];
          spawnInterval = setInterval(() => {
            setHoles((currentHoles) => {
              const activeCount = currentHoles.filter(h => h !== null && !h.isWhacked && !h.isRetracting).length;
              if (activeCount >= settings.maxActive) return currentHoles;

              const emptyIndices = [];
              currentHoles.forEach((h, idx) => {
                if (h === null) emptyIndices.push(idx);
              });

              if (emptyIndices.length === 0) return currentHoles;

              const randomHoleIdx = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
              const randomZodiac = ZODIAC_DATA[Math.floor(Math.random() * ZODIAC_DATA.length)];
              
              const newHoles = [...currentHoles];
              const spawnId = Date.now() + Math.random();
              
              newHoles[randomHoleIdx] = {
                ...randomZodiac,
                spawnId,
                isWhacked: false,
                isRetracting: false,
                createdAt: Date.now()
              };

              // 時間到自動往下滑落
              setTimeout(() => {
                setHoles((latestHoles) => {
                  if (latestHoles[randomHoleIdx] && latestHoles[randomHoleIdx].spawnId === spawnId && !latestHoles[randomHoleIdx].isWhacked) {
                    const updated = [...latestHoles];
                    updated[randomHoleIdx] = { ...updated[randomHoleIdx], isRetracting: true };
                    
                    setTimeout(() => {
                      setHoles((finalHoles) => {
                        if (finalHoles[randomHoleIdx] && finalHoles[randomHoleIdx].spawnId === spawnId) {
                          const cleared = [...finalHoles];
                          cleared[randomHoleIdx] = null;
                          return cleared;
                        }
                        return finalHoles;
                      });
                    }, 300);

                    return updated;
                  }
                  return latestHoles;
                });
              }, settings.stayDuration);

              return newHoles;
            });
          }, settings.spawnInterval);
        }

        return () => {
          clearInterval(timerInterval);
          clearInterval(spawnInterval);
        };
      }, [gameState, level]);

      // 檢查關卡結束
      const checkLevelEnd = () => {
        setHoles(Array(9).fill(null));
        const target = levelSettings[level].targetScore;
        setScore((finalScore) => {
          if (finalScore >= target) {
            // 時間到的最後一刻剛好達標，紀錄該關花滿 30 秒
            setLevelTimes(prev => ({ ...prev, [level]: 30 }));
            if (level === 3) {
              triggerUltimateVictory();
            } else {
              setGameState('LEVEL_WON');
            }
          } else {
            setGameState('GAME_OVER');
          }
          return finalScore;
        });
      };

      // 勝利流程
      const triggerUltimateVictory = () => {
        setGameState('CELEBRATING');
        playFirecrackerSynth();
        generateConfetti();

        setTimeout(() => {
          setGameState('CHAMPION');
          playContinuousZodiacAudio();
        }, 1800);
      };

      // Web Audio API 合成音效 (響炮鞭炮聲)
      const playFirecrackerSynth = () => {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();

          for (let i = 0; i < 35; i++) {
            const timeDelay = i * 0.07 + Math.random() * 0.05;
            setTimeout(() => {
              const bufferSize = ctx.sampleRate * 0.04;
              const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
              const data = buffer.getChannelData(0);
              for (let j = 0; j < bufferSize; j++) {
                data[j] = Math.random() * 2 - 1;
              }

              const noise = ctx.createBufferSource();
              noise.buffer = buffer;

              const filter = ctx.createBiquadFilter();
              filter.type = 'highpass';
              filter.frequency.value = 1200 + Math.random() * 800;

              const gain = ctx.createGain();
              gain.gain.setValueAtTime((0.3 + Math.random() * 0.4) * soundVolume, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.03);

              noise.connect(filter);
              filter.connect(gain);
              gain.connect(ctx.destination);
              noise.start();
            }, timeDelay * 1000);
          }

          setTimeout(() => {
            const bufferSize = ctx.sampleRate * 0.4; 
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let j = 0; j < bufferSize; j++) {
              data[j] = Math.random() * 2 - 1;
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 350;

            const gain = ctx.createGain();
            gain.gain.setValueAtTime(1.0 * soundVolume, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(ctx.destination);
            noise.start();
          }, 2400);

        } catch (e) {
          console.error('Web Audio Synth failed:', e);
        }
      };

      const generateConfetti = () => {
        const items = [];
        const colors = ['#ff007f', '#ffaa00', '#33ccff', '#22dd88', '#b800ff', '#ff5500'];
        for (let i = 0; i < 80; i++) {
          items.push({
            id: i,
            x: Math.random() * 100,
            y: Math.random() * 50 + 100,
            size: Math.random() * 15 + 8,
            color: colors[Math.floor(Math.random() * colors.length)],
            delay: Math.random() * 1.5,
            tilt: Math.random() * 360,
            speed: Math.random() * 3 + 2
          });
        }
        setConfetti(items);
      };

      // 播放 1鼠-12豬 的連續合輯音檔（只播放一次）
      const playContinuousZodiacAudio = () => {
        if (continuousAudioRef.current) {
          continuousAudioRef.current.pause();
        }
        const audio = new Audio(CONTINUOUS_AUDIO_URL);
        audio.volume = soundVolume;
        audio.loop = false; // 改成播放一次即停止

        // 當音檔播放完畢時，自動將播放按鈕的狀態變回「開始播放」
        audio.onended = () => {
          setIsPlayingContinuous(false);
        };

        continuousAudioRef.current = audio;
        
        audio.play()
          .then(() => setIsPlayingContinuous(true))
          .catch(e => {
            console.warn("自動播放受阻，需玩家手動播放:", e);
            setIsPlayingContinuous(false);
          });
      };

      const toggleContinuousAudio = () => {
        if (!continuousAudioRef.current) return;
        if (isPlayingContinuous) {
          continuousAudioRef.current.pause();
          setIsPlayingContinuous(false);
        } else {
          // 如果音檔先前已經播完了，播放前先將進度歸零重新開始
          if (continuousAudioRef.current.ended) {
            continuousAudioRef.current.currentTime = 0;
          }
          continuousAudioRef.current.play()
            .then(() => setIsPlayingContinuous(true))
            .catch(e => console.error(e));
        }
      };

      const stopContinuousAudio = () => {
        if (continuousAudioRef.current) {
          continuousAudioRef.current.pause();
          continuousAudioRef.current = null;
          setIsPlayingContinuous(false);
        }
      };

      // 生相圖片解析網址
      const getZodiacImageSrc = (zodiac) => {
        const attempt = imageFailCounter[zodiac.id] || 0;
        
        switch (attempt) {
          case 0:
            return `${imgBaseUrl}${encodeURIComponent(zodiac.filename)}`;
          case 1:
            return `${imgBaseUrl}${String(zodiac.id).padStart(2, '0')}.png`;
          case 2:
            return `${imgBaseUrl}${encodeURIComponent(zodiac.name + '.png')}`;
          default:
            return null;
        }
      };

      const handleImageError = (zodiacId) => {
        setImageFailCounter((prev) => ({
          ...prev,
          [zodiacId]: (prev[zodiacId] || 0) + 1
        }));
      };

      const playZodiacSound = (audioUrl) => {
        const audio = new Audio(audioUrl);
        audio.volume = soundVolume;
        audio.play().catch(err => console.log("音檔播放失敗:", err));
      };

      // 皇冠智慧型尋路加載錯誤處理
      const handleCrownLoadError = () => {
        setCrownAttempt(prev => {
          const next = prev + 1;
          if (next === 1) {
            // 第二步：嘗試大小寫大寫 Crown
            setCrownImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/whackamole_assets/Crown.png');
          } else if (next === 2) {
            // 第三步：嘗試移到 zodiac_assets 資料夾找 crown
            setCrownImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/crown.png');
          } else if (next === 3) {
            // 第四步：嘗試移到 zodiac_assets 資料夾找 Crown
            setCrownImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/Crown.png');
          } else {
            // 全部尋路都失敗，啟用優雅降級表情符號
            setCrownLoadError(true);
          }
          return next;
        });
      };

      // 獎盃智慧型尋路加載錯誤處理
      const handleTrophyLoadError = () => {
        setTrophyAttempt(prev => {
          const next = prev + 1;
          if (next === 1) {
            // 第二步：嘗試大寫 Trophy
            setTrophyImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/zodiac_assets/Trophy.png');
          } else if (next === 2) {
            // 第三步：嘗試移到 whackamole_assets 資料夾
            setTrophyImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/whackamole_assets/trophy.png');
          } else if (next === 3) {
            // 第四步：嘗試移到 whackamole_assets 資料夾找 Trophy
            setTrophyImgSrc('https://raw.githubusercontent.com/tsong-su/iuhi/main/whackamole_assets/Trophy.png');
          } else {
            // 全部失敗，啟用表情符號
            setTrophyLoadError(true);
          }
          return next;
        });
      };

      // 打擊地鼠與物理動畫觸發
      const handleWhack = (holeIdx, e) => {
        const zodiac = holes[holeIdx];
        if (!zodiac || zodiac.isWhacked || zodiac.isRetracting) return;

        // 利用 DOM ref 觸發極致流暢的 0.15 秒揮擊旋轉動態，完全不卡頓
        if (cursorInnerRef.current) {
          cursorInnerRef.current.classList.add('scale-75', '-rotate-45');
          setTimeout(() => {
            if (cursorInnerRef.current) {
              cursorInnerRef.current.classList.remove('scale-75', '-rotate-45');
            }
          }, 150);
        }

        playZodiacSound(zodiac.audio);

        const updatedHoles = [...holes];
        updatedHoles[holeIdx] = { ...zodiac, isWhacked: true };
        setHoles(updatedHoles);
        
        const newScore = score + 1;
        setScore(newScore);

        const rect = e.currentTarget.getBoundingClientRect();
        const hitX = e.clientX - rect.left;
        const hitY = e.clientY - rect.top;

        const effectId = Date.now() + Math.random();
        setHitEffects((prev) => [
          ...prev,
          { id: effectId, x: hitX, y: hitY, emoji: zodiac.emoji, name: zodiac.name, pinyin: zodiac.pinyin }
        ]);

        setTimeout(() => {
          setHitEffects((prev) => prev.filter(ef => ef.id !== effectId));
        }, 1200);

        // 擊中後 0.5 秒縮回，0.8 秒重置洞口
        setTimeout(() => {
          setHoles((currentHoles) => {
            if (currentHoles[holeIdx] && currentHoles[holeIdx].spawnId === zodiac.spawnId) {
              const nextHoles = [...currentHoles];
              nextHoles[holeIdx] = { ...nextHoles[holeIdx], isRetracting: true };
              return nextHoles;
          }
            return currentHoles;
          });

          setTimeout(() => {
            setHoles((currentHoles) => {
              if (currentHoles[holeIdx] && currentHoles[holeIdx].spawnId === zodiac.spawnId) {
                const nextHoles = [...currentHoles];
                nextHoles[holeIdx] = null;
                return nextHoles;
              }
              return currentHoles;
            });
          }, 300);

        }, 500);

        const target = levelSettings[level].targetScore;
        if (newScore >= target) {
          // 達標通關，立即紀錄本關耗時 (30秒 - 剩餘秒數)
          const spent = 30 - timeLeft;
          setLevelTimes(prev => ({ ...prev, [level]: spent }));
          
          setTimeout(() => {
            if (level < 3) {
              setGameState('LEVEL_WON');
            } else {
              triggerUltimateVictory();
            }
          }, 700);
        }
      };

      const startGame = (startingLevel = 1) => {
        stopContinuousAudio();
        setLevel(startingLevel);
        setScore(0);
        setTimeLeft(30);
        setHoles(Array(9).fill(null));
        setImageFailCounter({});
        // 若從第一關開始，重置計時累加器
        if (startingLevel === 1) {
          setLevelTimes({ 1: 0, 2: 0, 3: 0 });
        }
        setGameState('PLAYING');
      };

      const nextLevel = () => {
        const nextLvl = level + 1;
        setLevel(nextLvl);
        setScore(0);
        setTimeLeft(30);
        setHoles(Array(9).fill(null));
        setGameState('PLAYING');
      };

      // 原生硬體加速更新游標位置 (100% 繞過 React state 重新渲染)
      const handleMouseMove = (e) => {
        if (!cursorRef.current || !boardRef.current) return;
        const rect = boardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // 直接操作 DOM style 實現極致零延遲貼合
        cursorRef.current.style.transform = `translate3d(${x - 30}px, ${y - 30}px, 0)`;
      };

      const handleMouseEnter = () => {
        if (cursorRef.current) {
          cursorRef.current.style.opacity = '1';
        }
      };

      const handleMouseLeave = () => {
        if (cursorRef.current) {
          cursorRef.current.style.opacity = '0';
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-tr from-rose-100 via-amber-50 to-sky-100 flex flex-col items-center justify-center p-4 font-sans select-none overflow-x-hidden relative">
          
          {/* 頂部標題與 Logo */}
          <header className="w-full max-w-4xl bg-white shadow-xl rounded-3xl p-4 flex flex-col md:flex-row items-center justify-between border-4 border-pink-400 z-10 gap-4 mb-4">
            <div className="flex items-center space-x-4">
              {!logoLoadError ? (
                <img 
                  src={LOGO_URL}
                  alt="Logo"
                  onError={() => setLogoLoadError(true)}
                  className="w-16 h-16 object-contain rounded-2xl border-2 border-pink-200 shadow-sm bg-pink-50/50 p-1"
                />
              ) : (
                <div className="w-16 h-16 bg-gradient-to-br from-pink-400 to-orange-400 rounded-2xl flex items-center justify-center text-3xl shadow-sm">
                  🏫
                </div>
              )}
              
              <div>
                <h1 className="text-2xl sm:text-3xl font-black bg-gradient-to-r from-pink-600 via-purple-600 to-orange-600 bg-clip-text text-transparent tracking-wide flex items-center gap-2">
                  十二生相台語拍鼢鼠(phah bùn-tshí)
                </h1>
                <p className="text-xs sm:text-sm text-pink-500 font-extrabold tracking-wider">聽台語、認生相、好耍新體驗！</p>
              </div>
            </div>
            
            {/* 打擊道具選擇區與音量控制 */}
            <div className="flex flex-col sm:flex-row items-center gap-3 bg-gradient-to-r from-pink-50 to-orange-50 p-3 rounded-2xl border-2 border-pink-100 max-w-md md:max-w-none">
              {/* 道具切換 - 客製化提示文字升級 */}
              <div className="flex flex-col items-start w-full sm:w-auto">
                <span className="text-[10px] sm:text-[11px] text-pink-600 font-black mb-1 leading-normal max-w-[280px] sm:max-w-xs md:max-w-md">
                  🎁 請先選擇打擊法寶，在按下方的重新挑戰第一回按鈕開始挑戰遊戲:
                </span>
                <div className="flex flex-wrap gap-1 bg-white p-1 rounded-xl border border-pink-200 w-full">
                  {WEAPONS.map((weapon) => (
                    <button
                      key={weapon.id}
                      onClick={() => setSelectedWeapon(weapon)}
                      title={weapon.name}
                      className={`p-1.5 rounded-lg transition-all flex items-center gap-1 border ${
                        selectedWeapon.id === weapon.id 
                          ? 'bg-gradient-to-r from-pink-500 to-rose-500 text-white font-black scale-105 shadow-md border-pink-600' 
                          : 'hover:bg-pink-100 text-gray-700 border-gray-100'
                      }`}
                    >
                      <img 
                        src={`${imgBaseUrl}${encodeURIComponent(weapon.filename)}`} 
                        alt={weapon.name} 
                        className="w-7 h-7 object-contain"
                      />
                      <span className="text-[10px] font-black hidden lg:inline">{weapon.name}</span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="h-px sm:h-10 w-full sm:w-px bg-pink-200" />

              {/* 音量調整 */}
              <div className="flex items-center space-x-1.5 shrink-0">
                <span className="text-xs font-black text-pink-600">🔊 音量:</span>
                <input 
                  type="range" 
                  min="0" 
                  max="1" 
                  step="0.1" 
                  value={soundVolume} 
                  onChange={(e) => setSoundVolume(parseFloat(e.target.value))}
                  className="w-16 accent-pink-500 h-1.5 rounded-lg cursor-pointer"
                />
              </div>
            </div>
          </header>

          {/* 主畫面 */}
          <main className="w-full max-w-4xl flex-grow flex items-center justify-center py-2">
            
            {/* 1. 開始畫面 */}
            {gameState === 'START' && (
              <div className="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-lg border-4 border-pink-400 transform hover:scale-102 transition duration-300">
                <div className="flex justify-center space-x-2 mb-4 animate-bounce">
                  <img src={`${imgBaseUrl}Lollipop.png`} alt="Lollipop" className="w-16 h-16 object-contain" />
                  <img src={`${imgBaseUrl}Bangbang%20legs.png`} alt="Chicken Leg" className="w-16 h-16 object-contain" />
                  <img src={`${imgBaseUrl}Soft-Face%20Hammer.png`} alt="Hammer" className="w-16 h-16 object-contain" />
                </div>
                <h2 className="text-3xl font-black text-gray-800 mb-4 tracking-wide">學台語！生相大作戰</h2>
                <p className="text-gray-600 mb-6 leading-relaxed font-semibold">
                  點擊冒出來的十二生相地鼠，就能聆聽對應的<b>台語發音</b>！過關速度會越來越快，完成三關挑戰可獲得「十二生相冠軍獎杯」喔！
                </p>
                
                <div className="bg-gradient-to-r from-pink-50 to-amber-50 rounded-2xl p-4 mb-6 text-left border border-pink-100">
                  <h3 className="font-black text-pink-700 mb-2">🎯 遊戲規則與過關標準：</h3>
                  <ul className="text-sm text-pink-950 space-y-1 list-disc list-inside font-bold">
                    <li>第一關：目標 10 分 (慢速)</li>
                    <li>第二關：目標 12 分 (中速)</li>
                    <li>第三關：目標 15 分 (極速挑戰)</li>
                  </ul>
                </div>

                <button 
                  onClick={() => startGame(1)}
                  className="w-full py-4 bg-gradient-to-r from-pink-500 via-red-500 to-orange-500 text-white font-black text-xl rounded-2xl shadow-xl hover:from-pink-600 hover:to-orange-600 transform active:scale-95 transition-all"
                >
                  🎮 開始挑戰第一關
                </button>
              </div>
            )}

            {/* 2. 遊戲進行中 */}
            {gameState === 'PLAYING' && (
              <div className="w-full flex flex-col items-center">
                
                {/* 計分板與資訊欄 */}
                <div className="w-full grid grid-cols-3 gap-3 mb-4 text-center max-w-2xl">
                  <div className="bg-white rounded-2xl p-3 shadow-md border-2 border-sky-300">
                    <span className="text-xs text-gray-500 font-extrabold block">挑戰關卡</span>
                    <span className="text-xl sm:text-2xl font-black text-sky-500">第 {level} 關</span>
                  </div>
                  <div className="bg-white rounded-2xl p-3 shadow-md border-2 border-pink-300 relative overflow-hidden">
                    <span className="text-xs text-gray-500 font-extrabold block">目前得分 / 目標</span>
                    <span className="text-xl sm:text-2xl font-black text-pink-500">
                      {score} <span className="text-sm text-gray-400">/ {levelSettings[level].targetScore}</span>
                    </span>
                    <div className="absolute bottom-0 left-0 h-1.5 bg-pink-400 transition-all duration-300" style={{ width: `${Math.min(100, (score / levelSettings[level].targetScore) * 100)}%` }} />
                  </div>
                  <div className="bg-white rounded-2xl p-3 shadow-md border-2 border-orange-300">
                    <span className="text-xs text-gray-500 font-extrabold block">剩餘時間</span>
                    <span className={`text-xl sm:text-2xl font-black ${timeLeft <= 5 ? 'text-red-600 animate-ping' : 'text-orange-500'}`}>
                      {timeLeft} 秒
                    </span>
                  </div>
                </div>

                {/* 打地鼠地圖主板塊 */}
                <div 
                  id="game-board"
                  ref={boardRef}
                  onMouseMove={handleMouseMove}
                  onMouseEnter={handleMouseEnter}
                  onMouseLeave={handleMouseLeave}
                  className="w-full max-w-2xl bg-gradient-to-b from-emerald-300 via-green-400 to-teal-500 rounded-3xl p-4 sm:p-6 shadow-2xl border-4 border-emerald-600 grid grid-cols-3 gap-4 relative overflow-hidden aspect-[4/3] cursor-none"
                >
                  
                  {/* 地洞渲染 */}
                  {holes.map((zodiac, idx) => (
                    <div 
                      key={idx}
                      onClick={(e) => handleWhack(idx, e)}
                      className="bg-emerald-800/60 rounded-2xl border-b-8 border-emerald-950 flex items-end justify-center relative overflow-hidden shadow-inner cursor-none group active:scale-95 transition-transform"
                    >
                      {/* 土堆/洞底裝飾 */}
                      <div className="absolute bottom-0 w-11/12 h-6 bg-amber-950 rounded-t-full opacity-60 z-0"></div>

                      {/* 冒出來的十二生相 */}
                      <div 
                        className={`w-11/12 h-[85%] flex flex-col items-center justify-end pb-1 transition-all duration-300 ease-out transform origin-bottom z-10 ${
                          zodiac === null 
                            ? 'translate-y-full opacity-0 scale-75' 
                            : zodiac.isRetracting 
                              ? 'translate-y-full opacity-0 scale-90' 
                              : zodiac.isWhacked 
                                ? 'translate-y-0 scale-95 opacity-90' 
                                : 'translate-y-0 scale-100'
                        }`}
                      >
                        {zodiac !== null && (
                          /* 生相卡片 */
                          <div className="relative bg-white/95 rounded-2xl p-1 shadow-lg border-2 border-amber-400 flex flex-col items-center justify-between w-full h-full max-h-[125px]">
                            
                            {/* 精美生相圖片 / 失敗時 fallback 顯示 emoji */}
                            {getZodiacImageSrc(zodiac) ? (
                              <div className="w-full h-[65%] flex items-center justify-center p-1 mt-0.5 overflow-hidden">
                                <img 
                                  src={getZodiacImageSrc(zodiac)}
                                  onError={() => handleImageError(zodiac.id)}
                                  alt={zodiac.name}
                                  className="max-w-full max-h-full object-contain select-none pointer-events-none"
                                />
                              </div>
                            ) : (
                              <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-orange-400 to-amber-200 flex items-center justify-center text-3xl shadow-md mt-2">
                                {zodiac.emoji}
                              </div>
                            )}

                            <div className="text-center pb-1">
                              <span className="text-sm font-black text-gray-800">{zodiac.name}</span>
                              <span className="text-[10px] text-amber-700 font-semibold block leading-none">{zodiac.pinyin}</span>
                            </div>

                            {/* 擊中標誌 */}
                            {zodiac.isWhacked && (
                              <div className="absolute inset-0 bg-red-500/25 rounded-2xl flex items-center justify-center z-20">
                                <span className="text-4xl animate-bounce">💥</span>
                              </div>
                            )}
                          </div>
                        )}
                      </div>

                      {/* 草叢遮罩：遮擋地鼠冒出底部 */}
                      <div className="absolute bottom-0 left-0 right-0 h-4 bg-gradient-to-t from-emerald-600 to-transparent pointer-events-none z-20" />
                    </div>
                  ))}

                  {/* 漂浮打擊效果 */}
                  {hitEffects.map((effect) => (
                    <div 
                      key={effect.id}
                      style={{ left: effect.x, top: effect.y }}
                      className="absolute pointer-events-none z-30 transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center animate-[ping_1s_infinite]"
                    >
                      <div className="bg-white/90 border-2 border-pink-400 rounded-full py-1 px-3 shadow-xl flex items-center space-x-1">
                        <span className="text-xl">{effect.emoji}</span>
                        <span className="text-base font-black text-pink-600">{effect.name} ({effect.pinyin})</span>
                        <span className="text-lg font-extrabold text-orange-500">+1</span>
                      </div>
                    </div>
                  ))}

                  {/* 原生硬體加速滑鼠特效道具 */}
                  <div 
                    ref={cursorRef}
                    style={{ 
                      transform: 'translate3d(-100px, -100px, 0)',
                      transition: 'opacity 0.15s ease-out',
                      opacity: 0
                    }}
                    className="absolute w-16 h-16 pointer-events-none z-50 hidden sm:block select-none"
                  >
                    <div 
                      ref={cursorInnerRef}
                      className="w-full h-full flex items-center justify-center transition-transform duration-100 ease-out origin-bottom-right"
                    >
                      <img 
                        src={`${imgBaseUrl}${encodeURIComponent(selectedWeapon.filename)}`}
                        alt={selectedWeapon.name}
                        className="w-14 h-14 object-contain drop-shadow-xl select-none pointer-events-none"
                      />
                    </div>
                  </div>
                </div>
                
                {/* 提示教學 */}
                <p className="text-xs text-pink-800 mt-3 font-extrabold tracking-wide">
                  💡 電腦端移動滑鼠即會呈現選定法寶；行動裝置/平板直接點選生相卡片即可擊打喔！
                </p>
              </div>
            )}

            {/* 3. 關卡挑戰成功（第一、二關） */}
            {gameState === 'LEVEL_WON' && (
              <div className="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-md border-4 border-green-400">
                <div className="text-7xl mb-4 animate-[bounce_1.2s_infinite]">🎉</div>
                <h2 className="text-3xl font-black text-green-600 mb-2">恭喜過關！</h2>
                <p className="text-gray-700 mb-6 text-lg font-bold">
                  您成功通過了 <b>第 {level} 關</b> 的考驗！
                </p>
                <div className="bg-green-50 rounded-2xl p-4 mb-6 border border-green-200 animate-pulse">
                  <span className="text-sm text-gray-500 font-extrabold block">本關得分</span>
                  <span className="text-3xl font-black text-green-700">{score} 分</span>
                </div>
                
                <button 
                  onClick={nextLevel}
                  className="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-black text-lg rounded-2xl shadow-md hover:from-green-600 hover:to-emerald-700 transition"
                >
                  🚀 挑戰第 {level + 1} 關 (速度變快！)
                </button>
              </div>
            )}

            {/* 4. 遊戲失敗 */}
            {gameState === 'GAME_OVER' && (
              <div className="bg-white rounded-3xl p-8 shadow-2xl text-center max-w-md border-4 border-red-400">
                <div className="text-7xl mb-4">😢</div>
                <h2 className="text-3xl font-black text-red-600 mb-2">時間到！挑戰失敗</h2>
                <p className="text-gray-600 mb-6 font-semibold">
                  還差一點點就過關了，加油！只要多加練習台語與反應，一定可以過關的。
                </p>
                <div className="bg-red-50 rounded-2xl p-4 mb-6 border border-red-200">
                  <span className="text-sm text-gray-500 font-bold block">本關得分 / 目標</span>
                  <span className="text-3xl font-black text-red-600">{score} <span className="text-xl text-gray-400">/ {levelSettings[level].targetScore}</span></span>
                </div>

                <div className="flex space-x-3">
                  <button 
                    onClick={() => startGame(level)}
                    className="flex-1 py-3 bg-orange-500 text-white font-bold rounded-xl shadow-md hover:bg-orange-600 transition"
                  >
                    🔄 再試一次
                  </button>
                  <button 
                    onClick={() => setGameState('START')}
                    className="flex-1 py-3 bg-gray-200 text-gray-700 font-bold rounded-xl shadow-md hover:bg-gray-300 transition"
                  >
                    🏠 回首頁
                  </button>
                </div>
              </div>
            )}

            {/* 5. 通關慶祝中（響炮畫面，維持1.8秒） */}
            {gameState === 'CELEBRATING' && (
              <div className="text-center">
                <div className="text-9xl animate-ping mb-8">🧨</div>
                <h2 className="text-4xl font-extrabold text-red-600 tracking-wider animate-bounce">
                  💥 噼里啪啦！恭喜大成功！ 💥
                </h2>
                <p className="text-amber-700 font-bold mt-4 text-xl">正在準備頒發榮譽冠軍獎杯...</p>
                
                {/* 炫麗彩色飄帶與碎紙 */}
                <div className="fixed inset-0 pointer-events-none z-50 overflow-hidden">
                  {confetti.map((c) => (
                    <div
                      key={c.id}
                      className="animate-fall"
                      style={{
                        left: `${c.x}%`,
                        top: `0px`,
                        width: `${c.size}px`,
                        height: `${c.size}px`,
                        backgroundColor: c.color,
                        transform: `rotate(${c.tilt}deg)`,
                        animationDuration: `${c.speed}s`,
                        animationDelay: `${c.delay}s`,
                        position: 'absolute',
                        opacity: 0.8,
                        borderRadius: '50%'
                      }}
                    />
                  ))}
                </div>
              </div>
            )}

            {/* 6. 冠軍榮耀畫面 */}
            {gameState === 'CHAMPION' && (
              <div className="w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 shadow-2xl border-8 border-yellow-400 text-center relative overflow-hidden transform hover:scale-101 transition duration-300">
                
                {/* 獎狀背景裝飾花紋 */}
                <div className="absolute inset-2 border-4 border-double border-yellow-300 rounded-2xl pointer-events-none" />
                <div className="absolute -top-10 -left-10 w-40 h-40 bg-yellow-200 rounded-full filter blur-xl opacity-50 pointer-events-none" />
                <div className="absolute -bottom-10 -right-10 w-40 h-40 bg-amber-200 rounded-full filter blur-xl opacity-50 pointer-events-none" />

                {/* 獎盃與星光 */}
                <div className="relative z-10">
                  
                  {/* 實體冠軍獎盃圖片 (配有智慧型 onError 防錯尋路機制) */}
                  {!trophyLoadError ? (
                    <img 
                      src={trophyImgSrc}
                      onError={handleTrophyLoadError}
                      alt="Trophy"
                      className="w-32 h-32 mx-auto animate-[bounce_2s_infinite] filter drop-shadow-xl my-4 object-contain"
                    />
                  ) : (
                    <div className="text-8xl my-4">🏆</div>
                  )}
                  
                  {!logoLoadError && (
                    <img 
                      src={LOGO_URL} 
                      alt="Logo" 
                      className="w-14 h-14 mx-auto my-2 object-contain rounded-lg border border-yellow-100 bg-white p-1"
                    />
                  )}

                  {/* 👑 智慧型自動修復皇冠載入器：解決 GitHub 緩存延遲或路徑大小寫錯誤，100% 成功顯圖！ */}
                  <h2 className="text-3xl sm:text-4xl font-black text-yellow-600 tracking-widest mt-2 flex items-center justify-center gap-3">
                    {!crownLoadError ? (
                      <img 
                        src={crownImgSrc} 
                        onError={handleCrownLoadError} 
                        alt="Crown" 
                        className="w-10 h-10 object-contain" 
                      />
                    ) : (
                      <span className="text-3xl">👑</span>
                    )}
                    
                    <span>榮譽生相冠軍獎杯</span>
                    
                    {!crownLoadError ? (
                      <img 
                        src={crownImgSrc} 
                        onError={handleCrownLoadError} 
                        alt="Crown" 
                        className="w-10 h-10 object-contain" 
                      />
                    ) : (
                      <span className="text-3xl">👑</span>
                    )}
                  </h2>
                  <p className="text-sm font-semibold text-amber-700 tracking-wide mt-1">恭喜學生成功挑戰 12 生相台語極速拍鼢鼠！</p>
                  
                  {/* 正宗台語本土化頒獎文字 */}
                  <div className="my-6 border-y border-dashed border-yellow-300 py-4 max-w-md mx-auto">
                    <p className="text-gray-700 leading-relaxed font-bold">
                      這位挑戰者跤手實在足猛掠的，真緊就通過所有的關卡，相信對十二生相的台語發音已經足熟手，特別頒發獎杯來鼓勵你，請繼續加油！
                    </p>
                  </div>

                  {/* ⏱️ 挑戰時間詳細成績單 */}
                  <div className="bg-amber-50 rounded-2xl p-4 max-w-md mx-auto border-2 border-amber-200 mb-6 text-left shadow-inner">
                    <h3 className="text-center font-black text-amber-800 text-base mb-3">⏱️ 挑戰時間成績單 ⏱️</h3>
                    <div className="grid grid-cols-3 gap-2 text-center text-xs font-bold text-amber-900 mb-3">
                      <div className="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm">
                        <span className="text-gray-500 block mb-1 font-extrabold">第一關</span>
                        <span className="text-base font-black text-pink-500">{levelTimes[1]} 秒</span>
                      </div>
                      <div className="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm">
                        <span className="text-gray-500 block mb-1 font-extrabold">第二關</span>
                        <span className="text-base font-black text-pink-500">{levelTimes[2]} 秒</span>
                      </div>
                      <div className="bg-white p-2.5 rounded-xl border border-amber-200 shadow-sm">
                        <span className="text-gray-500 block mb-1 font-extrabold">第三關</span>
                        <span className="text-base font-black text-pink-500">{levelTimes[3]} 秒</span>
                      </div>
                    </div>
                    <div className="bg-gradient-to-r from-pink-500 to-rose-500 text-white p-3 rounded-xl text-center font-black text-base shadow-md">
                      🎉 總挑戰花費時間：{levelTimes[1] + levelTimes[2] + levelTimes[3]} 秒 🎉
                    </div>
                  </div>

                  {/* 1鼠.12豬連續音檔播放器 */}
                  <div className="bg-yellow-50 rounded-2xl p-4 max-w-md mx-auto border border-yellow-200 mb-6 flex flex-col items-center">
                    <span className="text-xs text-amber-600 font-bold block mb-1">🎵 正在播放十二生相連續音檔 (1鼠-12豬)</span>
                    <p className="text-sm font-bold text-gray-700 mb-3">十二生相 1 鼠 . 12 豬.mp3</p>
                    
                    {/* 播放控制鍵 */}
                    <div className="flex items-center space-x-4">
                      <button 
                        onClick={toggleContinuousAudio}
                        className="p-3 bg-yellow-500 hover:bg-yellow-600 text-white rounded-full shadow-md transform active:scale-95 transition"
                      >
                        {isPlayingContinuous ? (
                          <span className="text-xl">⏸️ 暫停播放</span>
                        ) : (
                          <span className="text-xl">▶️ 開始播放</span>
                        )}
                      </button>
                      <button 
                        onClick={playContinuousZodiacAudio}
                        className="py-1.5 px-3 bg-white border border-yellow-300 text-yellow-700 rounded-lg text-xs font-bold hover:bg-yellow-100 transition"
                      >
                        🔄 重頭播放
                      </button>
                    </div>
                  </div>

                  {/* 12生相互動複習區 */}
                  <div className="mt-4">
                    <h3 className="text-sm font-bold text-gray-500 mb-2">點擊按鈕，可以再次複習單個生相的台語發音喔：</h3>
                    <div className="grid grid-cols-4 sm:grid-cols-6 gap-2">
                      {ZODIAC_DATA.map((zodiac) => (
                        <button
                          key={zodiac.id}
                          onClick={() => playZodiacSound(zodiac.audio)}
                          className="bg-amber-50 hover:bg-amber-100 border border-amber-200 rounded-xl p-1 text-center transition transform active:scale-90"
                        >
                          <img 
                            src={getZodiacImageSrc(zodiac) || `${imgBaseUrl}${encodeURIComponent(zodiac.filename)}`} 
                            onError={(e) => { e.target.style.display = 'none'; }}
                            alt={zodiac.name} 
                            className="w-8 h-8 mx-auto object-contain mb-1"
                          />
                          <span className="text-xs font-bold text-gray-800">{zodiac.name}</span>
                          <span className="text-[9px] text-amber-700 block leading-none">{zodiac.pinyin}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* 重新挑戰 */}
                  <button 
                    onClick={() => startGame(1)}
                    className="mt-8 px-8 py-3 bg-gradient-to-r from-orange-500 to-amber-500 text-white font-black rounded-xl shadow-lg hover:from-orange-600 hover:to-amber-600 transform active:scale-95 transition-all"
                  >
                    🎮 重新挑戰第一關
                  </button>
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    // 將 App 元件掛載到網頁中
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
