<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kh_第 9 冊 > 第 4 課：臺灣 美麗的海翁</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.15); opacity: 0.6; } 100% { transform: scale(1); opacity: 1; } }
        .recording-anim { animation: pulse-ring 1s infinite ease-in-out; background-color: #fee2e2 !important; color: #dc2626 !important; border-color: #f87171 !important; }
        .tonemark { color: #ea580c; font-weight: 800; border-bottom: 2px dotted #ea580c; }
        .lighttone { color: #2563eb; font-weight: 700; border-bottom: 2px dashed #2563eb; }
    </style>
</head>
<body class="bg-gradient-to-br from-yellow-50 via-emerald-50 to-green-100 min-h-screen p-4 md:p-8 font-sans text-gray-800">
    
    <div id="menu-view" class="max-w-xl mx-auto space-y-6">
        <header class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-lg border border-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://github.com/tsong-su/iuhi/blob/main/logo.png?raw=true" class="w-12 h-12 object-contain" alt="Logo" onerror="this.src='https://placehold.co/48x48/10b981/ffffff?text=Logo'">
                <div>
                    <h1 class="font-extrabold text-lg text-green-900">kh_B9 第 4 課 - 課文跟讀</h1>
                    <p class="text-xs text-gray-500">跨平台全裝置語音練習系統</p>
                </div>
            </div>
            <button onclick="initGlobalMic()" id="global-mic-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow-md transition cursor-pointer">🎙️ 啟用麥克風</button>
        </header>

        <!-- LINE / 內建瀏覽器防呆警告 Banner -->
        <div id="browser-warning" class="hidden bg-red-50 border-2 border-red-300 text-red-900 p-5 rounded-3xl space-y-3 shadow-lg">
            <div class="font-extrabold flex items-center gap-2 text-base text-red-700">
                <span>🚨</span> 偵測到您目前使用 LINE 或社群軟體內建畫面！
            </div>
            <p class="text-xs leading-relaxed text-red-800 font-medium">
                因為手機軟體安全限制，<span class="font-bold underline">在 LINE 裡面無法順利錄音喔！</span>為了讓小朋友能順利練習，請改用手機內建瀏覽器開啟：
            </p>
            <div class="bg-white/80 p-3 rounded-2xl space-y-1.5 text-xs text-gray-700 font-semibold border border-red-100">
                <div class="flex items-center gap-1.5 text-red-900">
                    <span>📱</span> <span class="font-bold">Android 手機/平板：</span>請點擊畫面<span class="underline font-bold text-red-700">右上角</span>的選單（通常為直式或橫式三點 <span class="font-bold">⋮</span>），選擇「在瀏覽器中開啟」。
                </div>
                <div class="flex items-center gap-1.5 text-red-900">
                    <span>🍏</span> <span class="font-bold">iOS 蘋果手機/平板 (iPhone/iPad)：</span>請點擊畫面<span class="underline font-bold text-red-700">右下角</span>的直式三點選單（<span class="font-bold">⋮</span>），選擇「在 Safari 中開啟」。
                </div>
            </div>
        </div>

        <main class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-white space-y-3">
            <div class="text-sm font-bold text-teal-900 mb-2 px-1">📚 教材單元列表</div>
            <button onclick="openLesson()" class="w-full p-4 bg-slate-50 hover:bg-emerald-50 border border-slate-200 hover:border-emerald-300 rounded-2xl flex items-center justify-between transition shadow-sm group cursor-pointer">
                <div class="flex items-center gap-3 text-left">
                    <span class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-sm">課文</span>
                    <div>
                        <div class="font-bold text-gray-800 group-hover:text-emerald-800 text-base">kh_第 9 冊 > 第 4 課：臺灣 美麗的海翁</div>
                        <div class="text-xs text-gray-500">課文跟讀與錄音練習（跨平台雙系統選單防呆版）</div>
                    </div>
                </div>
                <span class="text-emerald-600 font-bold text-sm">進入練習 &rarr;</span>
            </button>
        </main>
    </div>

    <div id="lesson-view" class="max-w-2xl mx-auto space-y-4 hidden">
        <header class="bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-lg border border-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button onclick="backToMenu()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-2xl text-xs font-bold transition flex items-center gap-1 cursor-pointer">&larr; 返回選單</button>
                <h1 class="font-extrabold text-base md:text-lg text-green-900">kh_第 9 冊 > 第 4 課：臺灣 美麗的海翁</h1>
            </div>
            <img src="https://github.com/tsong-su/iuhi/blob/main/logo.png?raw=true" class="w-9 h-9 object-contain" alt="Logo" onerror="this.src='https://placehold.co/36x36/10b981/ffffff?text=Logo'">
        </header>
        <main class="space-y-4" id="sentences-container">
            <!-- 句子動態載入 -->
        </main>
    </div>

    <!-- 隱藏的標準課文音訊播放器 -->
    <audio id="lesson-audio-player" class="hidden" preload="auto"></audio>

    <script>
        const lessonSentences = [
            { text: "第4<span class=\"tonemark\">課</span>：臺<span class=\"tonemark\">灣</span> 美<span class=\"tonemark\">麗</span>的海<span class=\"tonemark\">翁</span>", roman: "Tē sì khò: Tâi-uân Bí-lē ê hái-ang", trans: "(第4課：臺灣 美麗的鯨魚)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_1.mp3" },
            { text: "臺<span class=\"tonemark\">灣</span>、臺<span class=\"tonemark\">灣</span>，一隻海<span class=\"tonemark\">翁</span>。", roman: "Tâi-uân, Tâi-uân, tsi̍t tsiah hái-ang.", trans: "(臺灣、臺灣，就像一隻鯨魚。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_2.mp3" },
            { text: "大<span class=\"tonemark\">喙</span>闊<span class=\"tonemark\">闊</span>是基<span class=\"tonemark\">隆</span>，尾<span class=\"tonemark\">溜</span>長<span class=\"tonemark\">長</span>屏東<span class=\"tonemark\">縣</span>。", roman: "tuā tshuì khuah-khuah sī Ke-lâng, bué-liu tn̂g-tn̂g Pîn-tong-kuān.", trans: "(嘴巴大大是基隆，尾巴長長是屏東縣。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_3.mp3" },
            { text: "尻脊<span class=\"tonemark\">骿</span>，媠噹<span class=\"tonemark\">噹</span>，宜<span class=\"tonemark\">蘭</span>、花<span class=\"tonemark\">蓮</span>到臺<span class=\"tonemark\">東</span>。", roman: "Kha-tsiah-phiann, suí-tang-tang, Gî-lân, Hua-liân kàu Tâi-tang.", trans: "(背脊看起來很漂亮，宜蘭、花蓮到臺東。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_4.mp3" },
            { text: "肥朒<span class=\"tonemark\">朒</span>，腹肚<span class=\"tonemark\">桶</span>，臺<span class=\"tonemark\">中</span>、彰<span class=\"tonemark\">化</span>、雲嘉<span class=\"tonemark\">南</span>。", roman: "Puî-tsut-tsut, pak-tóo-tháng, Tâi-tiong, Tsiong-huà, Hûn Ka Lâm.", trans: "(胖嘟嘟的是腹部，臺中、彰化、雲林、嘉義、臺南。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_5.mp3" },
            { text: "臺<span class=\"tonemark\">北</span>、高<span class=\"tonemark\">雄</span>、臺中<span class=\"tonemark\">港</span>，四通八<span class=\"tonemark\">達</span>四界<span class=\"tonemark\">迵</span>。", roman: "Tâi-pak, Ko-hiông, Tâi-tiong-káng, sù-thong-pat-ta̍t sì-kè thàng.", trans: "(臺北、高雄、臺中港，四通八達可以通四海。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_6.mp3" },
            { text: "美<span class=\"tonemark\">麗</span>的海<span class=\"tonemark\">翁</span>，是咱的希<span class=\"tonemark\">望</span>。", roman: "Bí-lē ê hái-ang, sī lán ê hi-bāng.", trans: "(美麗的鯨魚，是我們的希望。)", mp3: "https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/kh_B9_txet_4_7.mp3" }
        ];

        let activeRecorder = null;
        let activeStream = null;
        let currentRecordingIndex = null;
        let currentPlayingAudio = null;
        const audioChunksMap = {};
        const audioUrlMap = {};
        const isRecordingMap = {};

        window.addEventListener("DOMContentLoaded", () => {
            renderLessonUI();
            detectInAppBrowser();
        });

        function detectInAppBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            if (/Line|FBAN|FBAV|Instagram|WebView|Twitter/i.test(ua)) {
                const warning = document.getElementById("browser-warning");
                if (warning) warning.classList.remove("hidden");
            }
        }

        function renderLessonUI() {
            const container = document.getElementById("sentences-container");
            if (!container) return;
            let html = "";
            lessonSentences.forEach((item, index) => {
                html += `
                <div class="bg-white/95 backdrop-blur-md p-5 rounded-3xl shadow-md border border-green-100 space-y-3">
                    <div class="flex items-center gap-3">
                        <button onclick="playLessonAudio('${item.mp3}')" class="w-11 h-11 bg-teal-50 hover:bg-teal-100 text-teal-600 rounded-2xl flex items-center justify-center font-bold shrink-0 cursor-pointer" title="播放原音">▶</button>
                        <div class="space-y-0.5 w-full">
                            <div class="font-extrabold text-base text-gray-900">${item.text}</div>
                            <div class="text-xs font-semibold text-teal-700">${item.roman}</div>
                            <div class="text-xs text-gray-500">${item.trans}</div>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <button onclick="toggleStudentRecord(${index})" id="student-rec-${index}" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm border border-emerald-700 cursor-pointer">
                                <span>🎙️</span> <span id="student-rec-text-${index}">開始錄音</span>
                            </button>
                            <span id="student-status-${index}" class="text-xs text-red-500 hidden font-bold animate-pulse">🔴 錄音中...</span>
                        </div>
                        <div>
                            <button onclick="playStudentPlayback(${index})" id="student-pb-${index}" class="hidden px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold shadow-sm transition cursor-pointer">
                                <span>🔊</span> 聽回放
                            </button>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function playLessonAudio(url) {
            stopCurrentPlayback();
            const player = document.getElementById("lesson-audio-player");
            if (!player) return;
            player.src = url;
            player.play().catch(err => { console.error("播放原音失敗：" + err); });
        }

        function stopCurrentPlayback() {
            if (currentPlayingAudio) {
                currentPlayingAudio.pause();
                currentPlayingAudio.currentTime = 0;
                currentPlayingAudio = null;
            }
        }

        function initGlobalMic() {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                stream.getTracks().forEach(track => track.stop());
                const btn = document.getElementById("global-mic-btn");
                if (btn) { 
                    btn.innerText = "✅ 麥克風已就緒"; 
                    btn.classList.remove("bg-emerald-600"); 
                    btn.classList.add("bg-green-700"); 
                }
            }).catch(err => { 
                alert("無法啟用麥克風！請確認已授權瀏覽器麥克風權限。"); 
            });
        }

        function openLesson() {
            document.getElementById("menu-view").classList.add("hidden");
            document.getElementById("lesson-view").classList.remove("hidden");
        }

        function backToMenu() {
            stopCurrentPlayback();
            document.getElementById("lesson-view").classList.add("hidden");
            document.getElementById("menu-view").classList.remove("hidden");
        }

        function getSupportedMimeType() {
            const types = [
                'audio/webm;codecs=opus',
                'audio/webm',
                'audio/mp4',
                'audio/aac',
                'audio/ogg'
            ];
            for (let type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    return type;
                }
            }
            return '';
        }

        async function toggleStudentRecord(index) {
            stopCurrentPlayback();
            const lessonPlayer = document.getElementById("lesson-audio-player");
            if (lessonPlayer) { lessonPlayer.pause(); }

            const recBtn = document.getElementById("student-rec-" + index);
            const recText = document.getElementById("student-rec-text-" + index);
            const statusEl = document.getElementById("student-status-" + index);
            const pbBtn = document.getElementById("student-pb-" + index);

            if (isRecordingMap[index]) {
                if (activeRecorder && activeRecorder.state === "recording") {
                    activeRecorder.stop();
                }
                return;
            }

            if (currentRecordingIndex !== null && currentRecordingIndex !== index) {
                if (activeRecorder && activeRecorder.state === "recording") {
                    activeRecorder.stop();
                }
                isRecordingMap[currentRecordingIndex] = false;
                const oldRecText = document.getElementById("student-rec-text-" + currentRecordingIndex);
                if (oldRecText) oldRecText.innerText = "開始錄音";
                const oldStatus = document.getElementById("student-status-" + currentRecordingIndex);
                if (oldStatus) oldStatus.classList.add("hidden");
                const oldRecBtn = document.getElementById("student-rec-" + currentRecordingIndex);
                if (oldRecBtn) oldRecBtn.classList.remove("recording-anim");
            }

            try {
                if (recText) recText.innerText = "準備中...";
                
                if (activeStream) {
                    activeStream.getTracks().forEach(track => track.stop());
                    activeStream = null;
                }

                await new Promise(resolve => setTimeout(resolve, 300));

                if (recText) recText.innerText = "準備中...";

                activeStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });

                audioChunksMap[index] = [];
                currentRecordingIndex = index;

                let options = {};
                const mime = getSupportedMimeType();
                if (mime) {
                    options.mimeType = mime;
                }

                try {
                    activeRecorder = new MediaRecorder(activeStream, options);
                } catch (e) {
                    activeRecorder = new MediaRecorder(activeStream);
                }

                activeRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        audioChunksMap[index].push(e.data);
                    }
                };

                activeRecorder.onstop = () => {
                    if (activeStream) {
                        activeStream.getTracks().forEach(track => track.stop());
                        activeStream = null;
                    }

                    if (recText) recText.innerText = "⏳ 封裝處理中...";

                    setTimeout(() => {
                        if (audioUrlMap[index]) {
                            URL.revokeObjectURL(audioUrlMap[index]);
                        }

                        const blobType = activeRecorder.mimeType || 'audio/webm';
                        const blob = new Blob(audioChunksMap[index], { type: blobType });
                        
                        if (blob.size > 0) {
                            const audioUrl = URL.createObjectURL(blob);
                            audioUrlMap[index] = audioUrl;

                            if (recBtn) {
                                recBtn.classList.remove("recording-anim");
                                if (recText) recText.innerText = "重新錄音";
                            }
                            if (statusEl) statusEl.classList.add("hidden");

                            if (pbBtn) {
                                pbBtn.classList.remove("hidden");
                            }
                        } else {
                            alert("錄音檔建立異常（無聲音資料），請重新錄製一次。");
                            if (recBtn) {
                                recBtn.classList.remove("recording-anim");
                                if (recText) recText.innerText = "開始錄音";
                            }
                            if (statusEl) statusEl.classList.add("hidden");
                        }

                        isRecordingMap[index] = false;
                        currentRecordingIndex = null;
                    }, 1500);
                };

                activeRecorder.start(100);
                isRecordingMap[index] = true;
                if (recBtn) {
                    recBtn.classList.add("recording-anim");
                    if (recText) recText.innerText = "停止錄音";
                }
                if (statusEl) statusEl.classList.remove("hidden");
                if (pbBtn) pbBtn.classList.add("hidden");

            } catch (err) {
                if (recText) recText.innerText = "開始錄音";
                alert("無法啟用麥克風！如果您是透過 LINE 開啟，請依照提示點擊畫面右上角或右下角選單改用預設瀏覽器（Safari / Chrome）開啟。");
            }
        }

        function playStudentPlayback(index) {
            const url = audioUrlMap[index];
            if (!url) {
                alert("目前音訊檔案正在處理中，請稍候再試！");
                return;
            }
            stopCurrentPlayback();
            const lessonPlayer = document.getElementById("lesson-audio-player");
            if (lessonPlayer) { lessonPlayer.pause(); }

            const instantAudio = new Audio(url);
            currentPlayingAudio = instantAudio;

            instantAudio.play().catch(err => {
                console.error("回放播放失敗：", err);
                alert("回放播放失敗，請重新錄製一次。");
            });

            instantAudio.onended = () => {
                if (currentPlayingAudio === instantAudio) {
                    currentPlayingAudio = null;
                }
            };
        }
    </script>
</body>
</html>
