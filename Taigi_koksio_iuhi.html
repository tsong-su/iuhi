                            <h3 class="text-2xl sm:text-3xl font-black text-slate-800">十二生相、時間軸與節氣趣味學習</h3>
                        </div>
                        <button onclick="goHome()" class="px-5 py-2.5 bg-white hover:bg-slate-100 text-slate-700 font-black rounded-2xl text-sm border-2 border-slate-300 shadow-sm transition-all flex items-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> 返回頭頁
                        </button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${interactiveCardsHtml}
                    </div>
                `;
            }
        }

        function goHome() {
            currentView = 'home';
            selectedPublisher = null;
            selectedVolume = null;
            document.getElementById('searchInput').value = '';
            renderApp();
        }

        function selectPublisher(publisher) {
            currentView = 'publisher';
            selectedPublisher = publisher;
            selectedVolume = null;
            renderApp();
        }

        function selectVolume(volumeName) {
            currentView = 'volume';
            selectedVolume = volumeName;
            renderApp();
        }

        function selectInteractiveView() {
            currentView = 'interactive';
            renderApp();
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            if (!query) {
                if (currentView !== 'home') renderApp();
                return;
            }

            const container = document.getElementById('contentArea');
            const noResults = document.getElementById('noResults');
            const breadcrumbBar = document.getElementById('breadcrumbBar');
            breadcrumbBar.classList.add('hidden');
            container.innerHTML = '';

            let matchCards = '';
            let foundCount = 0;

            curriculumData.forEach(pub => {
                pub.volumes.forEach(vol => {
                    vol.games.forEach(game => {
                        if (game.name.toLowerCase().includes(query) || 
                            pub.publisher.toLowerCase().includes(query) || 
                            vol.volumeName.toLowerCase().includes(query)) {
                            
                            foundCount++;
                            let clickAction = '';
                            let badgeText = '入來遮耍';
                            if (game.type === 'coming') {
                                badgeText = '即將推出';
                                clickAction = `onclick="showComingSoon()"`;
                            } else if (game.type === 'external') {
                                clickAction = `onclick="window.open('${game.url}', '_blank')"`;
                            } else {
                                let itemsJson = encodeURIComponent(JSON.stringify(game.items));
                                clickAction = `onclick='openLessonSelector("${pub.publisher}", "${vol.volumeName}", "${game.name}", JSON.decode || decodeURIComponent("${itemsJson}"))'`;
                            }

                            matchCards += `
                                <div ${clickAction} class="bg-white rounded-3xl p-6 border-2 border-amber-300 shadow-md hover:shadow-xl cursor-pointer flex flex-col justify-between group transition-all">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="text-xs font-black bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-xl">${pub.publisher} ${vol.volumeName}</span>
                                            <span class="text-xs font-black px-3.5 py-1.5 rounded-2xl bg-amber-100 text-amber-800">${badgeText}</span>
                                        </div>
                                        <h5 class="font-black text-slate-800 text-lg mb-1 group-hover:text-amber-600 transition-colors">${game.name}</h5>
                                        <p class="text-slate-500 text-xs font-bold">${game.desc}</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t-2 border-slate-100 text-xs text-amber-600 font-black flex items-center justify-between">
                                        <span>點tsia 入去選遊戲</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            `;
                        }
                    });
                });
            });

            interactiveGamesData.forEach((game, index) => {
                if (game.title.toLowerCase().includes(query) || game.desc.toLowerCase().includes(query)) {
                    foundCount++;
                    let clickAction = '';
                    let isVideoOrPinyin = index >= 3;
                    let actionText = isVideoOrPinyin ? '點tsia入去選影片' : '點tsia入去選遊戲';
                    let badgeText = isVideoOrPinyin ? '入來遮看' : '入來遮耍';

                    if (game.type === 'external') {
                        clickAction = `onclick="window.open('${game.url}', '_blank')"`;
                    } else if (game.type === 'submenu') {
                        let itemsJson = encodeURIComponent(JSON.stringify(game.items));
                        clickAction = `onclick='openInteractiveSubmenu("${game.title}", JSON.decode || decodeURIComponent("${itemsJson}"), "${game.image || ''}")'`;
                    } else if (game.type === 'youtubeSubmenu') {
                        let catsJson = encodeURIComponent(JSON.stringify(game.categories));
                        clickAction = `onclick='openYoutubeCategoriesModal("${game.title}", JSON.decode || decodeURIComponent("${catsJson}"))'`;
                    }

                    matchCards += `
                        <div ${clickAction} class="bg-white rounded-3xl p-6 border-2 border-emerald-300 shadow-md hover:shadow-xl cursor-pointer flex flex-col justify-between group transition-all">
                            <div>
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-xs font-black bg-emerald-400 text-emerald-950 px-3.5 py-1.5 rounded-xl">互動遊戲區</span>
                                    <span class="text-xs font-black px-3.5 py-1.5 rounded-2xl bg-emerald-100 text-emerald-800">${badgeText}</span>
                                </div>
                                <h5 class="font-black text-slate-800 text-lg mb-1 group-hover:text-emerald-600 transition-colors">${game.title}</h5>
                                <p class="text-slate-500 text-xs font-bold">${game.desc}</p>
                            </div>
                            <div class="mt-4 pt-3 border-t-2 border-slate-100 text-xs text-emerald-600 font-black flex items-center justify-between">
                                <span>${actionText}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    `;
                }
            });

            if (foundCount > 0) {
                noResults.classList.add('hidden');
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-search mr-2 text-amber-500"></i>搜尋結果：找到 ${foundCount} 項相符內容</h3>
                        <button onclick="goHome()" class="px-4 py-2 bg-white text-slate-700 font-black rounded-2xl text-xs border-2 border-slate-300 shadow-sm">返回頭頁</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${matchCards}</div>
                `;
            } else {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
            }
        }

        function openLessonSelector(publisher, volume, gameName, encodedItems) {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');
            
            let items = typeof encodedItems === 'string' ? JSON.parse(decodeURIComponent(encodedItems)) : encodedItems;

            let lessonsButtons = items.map((lesson, idx) => `
                <a href="${lesson.url}" target="_blank"
                   class="flex items-center justify-between p-4 bg-amber-50 hover:bg-amber-500 hover:text-white border-2 border-amber-200 rounded-2xl font-black text-slate-800 shadow-sm transition-all group">
                    <div class="flex items-center space-x-3">
                        <span class="w-9 h-9 rounded-xl bg-amber-400 group-hover:bg-white group-hover:text-amber-600 text-amber-950 flex items-center justify-center text-sm shadow">
                            ${idx + 1}
                        </span>
                        <span class="text-base">${lesson.name}</span>
                    </div>
                    <span class="text-sm bg-white group-hover:bg-amber-600 group-hover:text-white text-amber-700 px-4 py-1.5 rounded-2xl shadow-sm border border-amber-200 flex items-center">
                        入來遮耍 <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i>
                    </span>
                </a>
            `).join('');

            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl mb-3 text-2xl shadow-inner border-2 border-amber-300">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div class="flex justify-center items-center space-x-2 mb-2">
                        <span class="text-xs font-black bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-xl">${publisher}</span>
                        <span class="text-xs font-black bg-emerald-400 text-emerald-950 px-3.5 py-1.5 rounded-xl">${volume}</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-1">${gameName}</h3>
                    <p class="text-slate-500 text-xs font-bold">請選擇您想要練習的課次：</p>
                </div>
                <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                    ${lessonsButtons}
                </div>
                <div class="mt-6 text-center">
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-2xl text-sm transition-all">
                        關閉視窗
                    </button>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function openInteractiveSubmenu(title, encodedItems, customImg) {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');
            
            let items = typeof encodedItems === 'string' ? JSON.parse(decodeURIComponent(encodedItems)) : encodedItems;

            let iconHtml = customImg ? 
                `<img src="${customImg}" alt="${title}" class="w-full h-full object-cover" onerror="this.onerror=null; this.innerHTML='<i class=\\'fa-solid fa-puzzle-piece text-white\\'></i>';">` : 
                `<i class="fa-solid fa-puzzle-piece"></i>`;

            let subButtons = items.map((item, idx) => `
                <a href="${item.url}" target="_blank"
                   class="flex items-center justify-between p-4 bg-emerald-50 hover:bg-emerald-600 hover:text-white border-2 border-emerald-200 rounded-2xl font-black text-slate-800 shadow-sm transition-all group">
                    <div class="flex items-center space-x-3">
                        <span class="w-9 h-9 rounded-xl bg-emerald-400 group-hover:bg-white group-hover:text-emerald-600 text-emerald-950 flex items-center justify-center text-sm shadow">
                            ${idx + 1}
                        </span>
                        <span class="text-base">${item.name}</span>
                    </div>
                    <span class="text-sm bg-white group-hover:bg-emerald-700 group-hover:text-white text-emerald-700 px-4 py-1.5 rounded-2xl shadow-sm border border-emerald-200 flex items-center">
                        入來遮看 <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i>
                    </span>
                </a>
            `).join('');

            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl mb-3 text-2xl shadow-inner border-2 border-emerald-300 overflow-hidden">
                        ${iconHtml}
                    </div>
                    <div class="flex justify-center items-center space-x-2 mb-2">
                        <span class="text-xs font-black bg-emerald-400 text-emerald-950 px-3.5 py-1.5 rounded-xl">互動遊戲區</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-1">${title}</h3>
                    <p class="text-slate-500 text-xs font-bold">請選擇您想要觀看的項目：</p>
                </div>
                <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                    ${subButtons}
                </div>
                <div class="mt-6 text-center">
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-2xl text-sm transition-all">
                        關閉視窗
                    </button>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function openYoutubeCategoriesModal(title, encodedCategories) {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');
            
            let categories = typeof encodedCategories === 'string' ? JSON.parse(decodeURIComponent(encodedCategories)) : encodedCategories;

            let categoriesHtml = categories.map((cat, cIdx) => {
                let itemsHtml = cat.items.map((item, iIdx) => `
                    <a href="${item.url}" target="_blank"
                       class="flex items-center justify-between p-3 bg-red-50 hover:bg-red-500 hover:text-white border border-red-200 rounded-xl font-black text-slate-800 shadow-xs transition-all group my-1">
                        <div class="flex items-center space-x-2.5 overflow-hidden">
                            <span class="w-7 h-7 rounded-lg bg-red-400 group-hover:bg-white group-hover:text-red-600 text-white flex items-center justify-center text-xs shadow flex-shrink-0">
                                ${iIdx + 1}
                            </span>
                            <span class="text-sm truncate">${item.name}</span>
                        </div>
                        <span class="text-xs bg-white group-hover:bg-red-600 group-hover:text-white text-red-600 px-3 py-1 rounded-xl shadow-xs border border-red-200 flex items-center flex-shrink-0 ml-2">
                            觀看影片 <i class="fa-solid fa-arrow-right ml-1 text-2xs"></i>
                        </span>
                    </a>
                `).join('');

                return `
                    <div class="mb-5 bg-slate-50 p-4 rounded-2xl border-2 border-slate-200 shadow-sm">
                        <h4 class="text-base font-black text-slate-800 mb-2.5 flex items-center">
                            <i class="fa-solid fa-folder-open mr-2 text-red-500"></i>${cat.categoryName}
                        </h4>
                        <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            }).join('');

            modalContent.innerHTML = `
                <div class="text-center mb-4">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 text-red-600 rounded-2xl mb-2 text-2xl shadow-inner border-2 border-red-300">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div class="flex justify-center items-center space-x-2 mb-1">
                        <span class="text-xs font-black bg-red-500 text-white px-3.5 py-1 rounded-xl">互動遊戲區</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-1">${title}</h3>
                    <p class="text-slate-500 text-xs font-bold">請選擇分類與影片觀看學習：</p>
                </div>
                <div class="max-h-80 overflow-y-auto pr-1">
                    ${categoriesHtml}
                </div>
                <div class="mt-6 text-center">
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-2xl text-sm transition-all">
                        關閉視窗
                    </button>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeLessonModal() {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function showComingSoon() {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');

            modalContent.innerHTML = `
                <div class="text-center py-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl mb-4 text-2xl shadow-inner border-2 border-amber-300">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2">即將推出</h3>
                    <p class="text-slate-600 text-sm font-bold mb-6">此冊別與影音內容尚在製作中，敬請期待！</p>
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl text-sm shadow-md transition-all">
                        我知道了
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.onload = function() {
            renderApp();
            initVisitCounter();
        }
    </script>
</body>
</html>
