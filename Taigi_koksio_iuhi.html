                    <i class="fa-solid fa-chevron-right text-xs opacity-70"></i>

        </section>

                                <h3 class="text-3xl font-black mb-3 drop-shadow">真平版</h3>
                                <p class="text-amber-100 font-bold text-base leading-relaxed mb-6">
                                    包含第 5、7、9、11 冊（以及預留第 6、8、10、12 冊），提供豐富的課文跟讀、輕鬆學語詞、句子重組、語詞對對碰與影音專區。
                                </p>
                            </div>
                            <div class="bg-white text-orange-600 py-3.5 px-6 rounded-2xl font-black text-center shadow-md flex items-center justify-center space-x-2 group-hover:bg-amber-50 transition-colors">
                                <span>uì tsia 開始</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>

                        <!-- 康軒版 Card -->
                        <div onclick="incrementVisit(); selectPublisher('康軒版')" 
                             class="bg-gradient-to-br from-sky-400 to-blue-600 rounded-3xl p-8 text-white shadow-2xl hover:scale-105 transition-all cursor-pointer border-4 border-white flex flex-col justify-between group">
                            <div>
                                <div class="flex justify-between items-center mb-6">
                                    <span class="bg-white/30 backdrop-blur-md px-4 py-1.5 rounded-2xl font-black text-sm tracking-wide">
                                        <i class="fa-solid fa-book-open mr-1.5"></i> 教材版本
                                    </span>
                                    <div class="w-14 h-14 bg-white text-blue-600 rounded-2xl flex items-center justify-center text-2xl shadow-lg group-hover:rotate-12 transition-transform">
                                        <i class="fa-solid fa-school"></i>
                                    </div>
                                </div>
                                <h3 class="text-3xl font-black mb-3 drop-shadow">康軒版</h3>
                                <p class="text-sky-100 font-bold text-base leading-relaxed mb-6">
                                    包含第 9、11 冊（以及預留第 10、12 冊），提供標準台語跟讀、詞彙運用、句子重組闖關與影音學習。
                                </p>
                            </div>
                            <div class="bg-white text-blue-600 py-3.5 px-6 rounded-2xl font-black text-center shadow-md flex items-center justify-center space-x-2 group-hover:bg-sky-50 transition-colors">
                                <span>uì tsia 開始</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentView === 'publisher') {
                breadcrumbBar.classList.remove('hidden');
                breadcrumbText.innerText = selectedPublisher;

                const pubObj = curriculumData.find(p => p.publisher === selectedPublisher);
                if (!pubObj) return;

                let volumesHtml = pubObj.volumes.map(vol => `
                    <div onclick="incrementVisit(); selectVolume('${vol.volumeName}')"
                         class="bg-white rounded-3xl p-6 border-2 border-amber-200 shadow-md hover:shadow-xl hover:border-orange-500 cursor-pointer flex flex-col justify-between group transition-all transform hover:-translate-y-1">
                        <div>
                            <div class="flex items-center justify-between mb-4">
                                <span class="${vol.badgeColor} font-black text-base px-4 py-2 rounded-2xl shadow-sm border border-black/10">${vol.volumeName}</span>
                                <span class="w-12 h-12 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-colors">
                                    <i class="fa-solid fa-gamepad text-lg"></i>
                                </span>
                            </div>
                            <h4 class="text-xl font-black text-slate-800 mb-2 group-hover:text-orange-600 transition-colors">${vol.subtitle}</h4>
                            <p class="text-slate-500 text-xs font-bold leading-relaxed">包含 5 項核心互動遊戲與 YouTube 影音</p>
                        </div>
                        <div class="mt-6 pt-4 border-t-2 border-slate-100 flex items-center justify-between text-xs text-orange-600 font-black">
                            <span>點tsia 入去選遊戲</span>
                            <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition-transform"></i>
                        </div>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="mb-8 flex items-center justify-between">
                        <div>
                            <span class="px-4.5 py-2 rounded-2xl text-sm font-black shadow ${pubObj.publisherBadge} mb-2 inline-block">
                                <i class="fa-solid fa-book-bookmark mr-2"></i>${pubObj.publisher}
                            </span>
                            <h3 class="text-2xl sm:text-3xl font-black text-slate-800">請選擇你欲練習的：</h3>
                        </div>
                        <button onclick="goHome()" class="px-5 py-2.5 bg-white hover:bg-slate-100 text-slate-700 font-black rounded-2xl text-sm border-2 border-slate-300 shadow-sm transition-all flex items-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> 轉去重選第幾冊
                        </button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${volumesHtml}
                    </div>
                `;
            } else if (currentView === 'volume') {
                breadcrumbBar.classList.remove('hidden');
                breadcrumbText.innerHTML = `<button onclick="selectPublisher('${selectedPublisher}')" class="hover:underline">${selectedPublisher}</button> <i class="fa-solid fa-chevron-right text-xs opacity-70 mx-1"></i> <span class="text-yellow-300">${selectedVolume}</span>`;

                const pubObj = curriculumData.find(p => p.publisher === selectedPublisher);
                const volObj = pubObj.volumes.find(v => v.volumeName === selectedVolume);
                if (!volObj) return;

                let gamesHtml = volObj.games.map(game => {
                    let clickAction = '';
                    let badgeText = '入來遮耍';
                    let badgeClass = 'bg-amber-100 text-amber-800 group-hover:bg-amber-500 group-hover:text-white';

                    if (game.type === 'coming') {
                        badgeText = '即將推出';
                        badgeClass = 'bg-slate-100 text-slate-400';
                        clickAction = `onclick="showComingSoon()"`;
                    } else if (game.type === 'external') {
                        badgeText = '前往影音';
                        badgeClass = 'bg-rose-100 text-rose-800 group-hover:bg-rose-600 group-hover:text-white';
                        clickAction = `onclick="incrementVisit(); window.open('${game.url}', '_blank')"`;
                    } else {
                        let itemsJson = encodeURIComponent(JSON.stringify(game.items));
                        clickAction = `onclick='incrementVisit(); openLessonSelector("${selectedPublisher}", "${selectedVolume}", "${game.name}", JSON.decode || decodeURIComponent("${itemsJson}"))'`;
                    }

                    return `
                        <div ${clickAction}
                             class="bg-white rounded-3xl p-6 border-2 border-slate-200 shadow-md hover:shadow-xl hover:border-amber-400 cursor-pointer flex flex-col justify-between group transition-all transform hover:-translate-y-1">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${game.color} text-white flex items-center justify-center text-2xl shadow-md group-hover:scale-110 transition-transform">
                                        <i class="${game.icon.includes('fa-brands') ? game.icon : 'fa-solid ' + game.icon}"></i>
                                    </div>
                                    <span class="text-xs font-black px-3.5 py-1.5 rounded-2xl transition-colors ${badgeClass}">${badgeText}</span>
                                </div>
                                <h5 class="font-black text-slate-800 text-lg mb-2 group-hover:text-amber-600 transition-colors">${game.name}</h5>
                                <p class="text-slate-500 text-xs font-bold leading-relaxed">${game.desc}</p>
                            </div>
                            <div class="mt-6 pt-4 border-t-2 border-slate-100 flex items-center justify-between text-xs text-slate-400 font-bold">
                                <span><i class="fa-solid fa-gamepad mr-1 text-amber-500"></i>互動學習</span>
                                <span class="text-amber-600 font-black flex items-center group-hover:translate-x-1 transition-transform">點tsia 入去選遊戲 <i class="fa-solid fa-arrow-right ml-1"></i></span>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="mb-8 flex items-center justify-between">
                        <div>
                            <span class="px-4.5 py-2 rounded-2xl text-sm font-black shadow ${pubObj.publisherBadge} mb-2 inline-block">
                                <i class="fa-solid fa-book-bookmark mr-2"></i>${selectedPublisher} - ${selectedVolume}
                            </span>
                            <h3 class="text-2xl sm:text-3xl font-black text-slate-800">${volObj.subtitle}</h3>
                        </div>
                        <button onclick="selectPublisher('${selectedPublisher}')" class="px-5 py-2.5 bg-white hover:bg-slate-100 text-slate-700 font-black rounded-2xl text-sm border-2 border-slate-300 shadow-sm transition-all flex items-center">
                            <i class="fa-solid fa-arrow-left mr-2"></i> 轉去重選第幾冊
                        </button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
                        ${gamesHtml}
                    </div>
                `;
            }
        }

        function goHome() {
            currentView = 'home';
            selectedPublisher = null;
            selectedVolume = null;
            document.getElementById('searchInput').value = '';
            renderApp();
        }

        function selectPublisher(publisher) {
            currentView = 'publisher';
            selectedPublisher = publisher;
            selectedVolume = null;
            renderApp();
        }

        function selectVolume(volumeName) {
            currentView = 'volume';
            selectedVolume = volumeName;
            renderApp();
        }

        function handleSearch(event) {
            const query = event.target.value.toLowerCase().trim();
            if (!query) {
                if (currentView !== 'home') renderApp();
                return;
            }

            const container = document.getElementById('contentArea');
            const noResults = document.getElementById('noResults');
            const breadcrumbBar = document.getElementById('breadcrumbBar');
            breadcrumbBar.classList.add('hidden');
            container.innerHTML = '';

            let matchCards = '';
            let foundCount = 0;

            curriculumData.forEach(pub => {
                pub.volumes.forEach(vol => {
                    vol.games.forEach(game => {
                        if (game.name.toLowerCase().includes(query) || 
                            pub.publisher.toLowerCase().includes(query) || 
                            vol.volumeName.toLowerCase().includes(query)) {
                            
                            foundCount++;
                            let clickAction = '';
                            let badgeText = '入來遮耍';
                            if (game.type === 'coming') {
                                badgeText = '即將推出';
                                clickAction = `onclick="showComingSoon()"`;
                            } else if (game.type === 'external') {
                                badgeText = '前往影音';
                                clickAction = `onclick="incrementVisit(); window.open('${game.url}', '_blank')"`;
                            } else {
                                let itemsJson = encodeURIComponent(JSON.stringify(game.items));
                                clickAction = `onclick='incrementVisit(); openLessonSelector("${pub.publisher}", "${vol.volumeName}", "${game.name}", JSON.decode || decodeURIComponent("${itemsJson}"))'`;
                            }

                            matchCards += `
                                <div ${clickAction} class="bg-white rounded-3xl p-6 border-2 border-amber-300 shadow-md hover:shadow-xl cursor-pointer flex flex-col justify-between group transition-all">
                                    <div>
                                        <div class="flex items-center justify-between mb-3">
                                            <span class="text-xs font-black bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-xl">${pub.publisher} ${vol.volumeName}</span>
                                            <span class="text-xs font-black px-3.5 py-1.5 rounded-2xl bg-amber-100 text-amber-800">${badgeText}</span>
                                        </div>
                                        <h5 class="font-black text-slate-800 text-lg mb-1 group-hover:text-amber-600 transition-colors">${game.name}</h5>
                                        <p class="text-slate-500 text-xs font-bold">${game.desc}</p>
                                    </div>
                                    <div class="mt-4 pt-3 border-t-2 border-slate-100 text-xs text-amber-600 font-black flex items-center justify-between">
                                        <span>點tsia 入去選遊戲</span>
                                        <i class="fa-solid fa-arrow-right"></i>
                                    </div>
                                </div>
                            `;
                        }
                    });
                });
            });

            if (foundCount > 0) {
                noResults.classList.add('hidden');
                container.innerHTML = `
                    <div class="mb-6 flex items-center justify-between">
                        <h3 class="text-xl font-black text-slate-800"><i class="fa-solid fa-search mr-2 text-amber-500"></i>搜尋結果：找到 ${foundCount} 項相符內容</h3>
                        <button onclick="goHome()" class="px-4 py-2 bg-white text-slate-700 font-black rounded-2xl text-xs border-2 border-slate-300 shadow-sm">返回頭頁</button>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">${matchCards}</div>
                `;
            } else {
                container.innerHTML = '';
                noResults.classList.remove('hidden');
            }
        }

        function openLessonSelector(publisher, volume, gameName, encodedItems) {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');
            
            let items = typeof encodedItems === 'string' ? JSON.parse(decodeURIComponent(encodedItems)) : encodedItems;

            let lessonsButtons = items.map((lesson, idx) => `
                <a href="${lesson.url}" target="_blank" onclick="incrementVisit()"
                   class="flex items-center justify-between p-4 bg-amber-50 hover:bg-amber-500 hover:text-white border-2 border-amber-200 rounded-2xl font-black text-slate-800 shadow-sm transition-all group">
                    <div class="flex items-center space-x-3">
                        <span class="w-9 h-9 rounded-xl bg-amber-400 group-hover:bg-white group-hover:text-amber-600 text-amber-950 flex items-center justify-center text-sm shadow">
                            ${idx + 1}
                        </span>
                        <span class="text-base">${lesson.name}</span>
                    </div>
                    <span class="text-sm bg-white group-hover:bg-amber-600 group-hover:text-white text-amber-700 px-4 py-1.5 rounded-2xl shadow-sm border border-amber-200 flex items-center">
                        入來遮耍 <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i>
                    </span>
                </a>
            `).join('');

            modalContent.innerHTML = `
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl mb-3 text-2xl shadow-inner border-2 border-amber-300">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div class="flex justify-center items-center space-x-2 mb-2">
                        <span class="text-xs font-black bg-amber-400 text-amber-950 px-3.5 py-1.5 rounded-xl">${publisher}</span>
                        <span class="text-xs font-black bg-emerald-400 text-emerald-950 px-3.5 py-1.5 rounded-xl">${volume}</span>
                    </div>
                    <h3 class="text-xl font-black text-slate-800 mb-1">${gameName}</h3>
                    <p class="text-slate-500 text-xs font-bold">請選擇您想要練習的課次：</p>
                </div>
                <div class="space-y-3 max-h-64 overflow-y-auto pr-1">
                    ${lessonsButtons}
                </div>
                <div class="mt-6 text-center">
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-black rounded-2xl text-sm transition-all">
                        關閉視窗
                    </button>
                </div>
            `;

            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeLessonModal() {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            container.classList.remove('scale-100', 'opacity-100');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function showComingSoon() {
            const modal = document.getElementById('lessonModal');
            const container = document.getElementById('modalContainer');
            const modalContent = document.getElementById('modalContent');

            modalContent.innerHTML = `
                <div class="text-center py-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl mb-4 text-2xl shadow-inner border-2 border-amber-300">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <h3 class="text-2xl font-black text-slate-800 mb-2">即將推出</h3>
                    <p class="text-slate-600 text-sm font-bold mb-6">此冊別與遊戲尚在製作中，敬請期待！</p>
                    <button onclick="closeLessonModal()" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-2xl text-sm shadow-md transition-all">
                        我知道了
                    </button>
                </div>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.classList.remove('scale-95', 'opacity-0');
                container.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        window.onload = function() {
            renderApp();
            document.getElementById('visitCount').innerText = visitCount;
        }
    </script>
</body>
</html>
