<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B9 第 3 課 - 句子重組闖關</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.2; }
        }
        .confetti {
            position: fixed;
            top: -20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: fall linear infinite;
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-yellow-50 via-purple-50 to-indigo-100 min-h-screen p-4 md:p-8 font-sans text-gray-800">
    <!-- 學生端手機音訊解鎖遮罩 -->
    <div id="student-unlock-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-md w-full shadow-2xl text-center space-y-4 border border-indigo-100">
            <div class="w-16 h-16 bg-gradient-to-tr from-pink-500 to-purple-600 rounded-2xl mx-auto flex items-center justify-center text-3xl shadow-lg">
                🎵
            </div>
            <div class="space-y-1">
                <h2 class="text-xl font-extrabold text-indigo-950">B9 第 3 課 - 句子重組闖關</h2>
                <p class="text-xs text-gray-500 leading-relaxed">
                    請點擊下方按鈕開始闖關，解鎖語音與勝利音效！
                </p>
            </div>
            <div class="bg-amber-50 border border-amber-200 text-amber-900 p-3 rounded-2xl text-[11px] text-left leading-relaxed">
                <span class="font-bold">💡 貼心提醒：</span>若透過 LINE 開啟，建議點擊右上角或右下角三點，選擇 <span class="font-bold text-amber-700 underline">「以瀏覽器開啟」</span>。
            </div>
            <button onclick="studentUnlockAudio()" class="w-full py-3.5 bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 text-white font-extrabold rounded-2xl shadow-lg hover:opacity-95 transition cursor-pointer">
                🚀 開始闖關
            </button>
        </div>
    </div>
    <div class="max-w-2xl mx-auto space-y-6">
        <header class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-lg border border-white flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://github.com/tsong-su/iuhi/blob/main/logo.png?raw=true" class="w-12 h-12 object-contain" alt="Logo">
                <div>
                    <h1 class="font-extrabold text-lg text-indigo-950">B9 第 3 課 - 句子重組闖關</h1>
                    <p class="text-xs text-gray-500">拖曳下方詞語塊完成句子重組</p>
                </div>
            </div>
            <button onclick="resetGame()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-2xl text-xs font-bold shadow transition cursor-pointer">🔄 重新開始</button>
        </header>
        <main id="game-main-container" class="bg-white/95 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-indigo-100 space-y-5">
        </main>
    </div>
    <audio id="sfx-win" src="https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/victory.mp3" preload="auto" class="hidden"></audio>
    <audio id="sfx-wrong" src="https://raw.githubusercontent.com/tsong-su/iuhi/main/game4_assets/wrong.mp3" preload="auto" class="hidden"></audio>
    <script>
        const questions = [{"idx":1,"tokens":["綠豆","發穎","了後","會","成做","豆菜"],"answerStr":"綠豆發穎了後會成做豆菜","hint":"綠豆發穎了後會成做豆菜","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_1.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_1.mp3"},{"idx":2,"tokens":["萬丹","的","紅豆","皮","薄","氣味","閣","芳"],"answerStr":"萬丹的紅豆皮薄氣味閣芳","hint":"萬丹的紅豆皮薄氣味閣芳","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_2.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_2.mp3"},{"idx":3,"tokens":["花豆","會當","提來","燖","排骨湯","喔"],"answerStr":"花豆會當提來燖排骨湯喔","hint":"花豆會當提來燖排骨湯喔","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_3.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_3.mp3"},{"idx":4,"tokens":["削","芋仔","愛","掛","手套","按呢","手","才","袂","癢"],"answerStr":"削芋仔愛掛手套按呢手才袂癢","hint":"削芋仔愛掛手套按呢手才袂癢","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_4.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_4.mp3"},{"idx":5,"tokens":["阿媽","做的","芋圓","大","閣","𩚨","足","好食","的"],"answerStr":"阿媽做的芋圓大閣𩚨足好食的","hint":"阿媽做的芋圓大閣𩚨足好食的","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_5.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_5.mp3"},{"idx":6,"tokens":["熱人","來","一","杯","仙草茶","清涼","閣","退火"],"answerStr":"熱人來一杯仙草茶清涼閣退火","hint":"熱人來一杯仙草茶清涼閣退火","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_6.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_6.mp3"},{"idx":7,"tokens":["黃色","粉粿","是","濫","黃梔仔花","落去","做","的"],"answerStr":"黃色粉粿是濫黃梔仔花落去做的","hint":"黃色粉粿是濫黃梔仔花落去做的","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_7.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_7.mp3"},{"idx":8,"tokens":["米篩目","會當","做甜的","嘛","會當","做鹹的"],"answerStr":"米篩目會當做甜的嘛會當做鹹的","hint":"米篩目會當做甜的嘛會當做鹹的","audioUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping_assets/B9_Example_3_8.mp3","audioBackupUrl":"https://raw.githubusercontent.com/tsong-su/iuhi/main/tsinping1_assets/B9_Example_3_8.mp3"}];
        let currentIndex = 0;
        let sortableInstance = null;
        const colors = [
            "bg-emerald-100 text-emerald-900 border-emerald-300",
            "bg-pink-100 text-pink-900 border-pink-300",
            "bg-amber-100 text-amber-900 border-amber-300",
            "bg-teal-100 text-teal-900 border-teal-300",
            "bg-purple-100 text-purple-900 border-purple-300",
            "bg-cyan-100 text-cyan-900 border-cyan-300",
            "bg-rose-100 text-rose-900 border-rose-300",
            "bg-indigo-100 text-indigo-900 border-indigo-300"
        ];
        function shuffle(array) {
            const copy = [...array];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }
        function playSfx(type) {
            const sfx = document.getElementById(type === 'win' ? 'sfx-win' : 'sfx-wrong');
            if (sfx) { sfx.currentTime = 0; sfx.play().catch(e => {}); }
        }
        function playDualAudio(primaryUrl, backupUrl) {
            const audio = new Audio(primaryUrl);
            audio.play().catch(() => {
                if (backupUrl) {
                    const backupAudio = new Audio(backupUrl);
                    backupAudio.play().catch(e => console.log('備用音檔播放失敗'));
                }
            });
        }
        function startConfetti() {
            const confettiColors = ['#f43f5e', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#fbbf24'];
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                document.body.appendChild(confetti);
            }
        }
        function studentUnlockAudio() {
            const modal = document.getElementById('student-unlock-modal');
            if (modal) {
                modal.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => { modal.remove(); }, 300);
            }
            renderGame();
            const q = questions[currentIndex];
            if (q) { playDualAudio(q.audioUrl, q.audioBackupUrl); }
        }
        function renderGame() {
            const container = document.getElementById('game-main-container');
            if (!container) return;
            if (currentIndex >= questions.length) {
                container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-8 rounded-3xl shadow-xl text-center space-y-4"><div class="text-5xl">🏆</div><h2 class="text-2xl font-extrabold text-white">恭喜過關！</h2><p class="text-xs text-pink-100">您已完成本課所有的句子重組挑戰！</p><button onclick="resetGame()" class="px-6 py-3 bg-white text-indigo-700 font-extrabold rounded-2xl shadow-md cursor-pointer hover:bg-pink-50 transition">🔄 閣挑戰一擺</button></div>';
                startConfetti();
                setTimeout(() => { playSfx('win'); }, 500);
                return;
            }
            const q = questions[currentIndex];
            const shuffled = shuffle(q.tokens);
            container.innerHTML = '<div class="bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 text-white p-4 rounded-3xl shadow flex items-center justify-between"><div><span class="bg-white/20 text-[10px] px-2.5 py-0.5 rounded-full font-bold">第 ' + (currentIndex + 1) + ' / ' + questions.length + ' 關</span><div class="text-xs text-pink-100 mt-1">💡 提示：' + q.hint + '</div></div><button onclick="playDualAudio(\'' + q.audioUrl + '\', \'' + q.audioBackupUrl + '\')" class="bg-white text-indigo-700 px-3.5 py-2 rounded-2xl text-xs font-extrabold shadow cursor-pointer hover:bg-pink-50">🔊 聽語音</button></div>' +
                '<div id="student-drag-box" class="p-5 rounded-3xl border-2 border-dashed border-indigo-300 min-h-[120px] flex flex-wrap items-center gap-2.5 bg-slate-50">' +
                shuffled.map((t, i) => '<div class="' + colors[i % colors.length] + ' px-4 py-2.5 rounded-2xl font-extrabold text-xs shadow-md border cursor-grab select-none transition transform hover:scale-105">' + t + '</div>').join('') +
                '</div>' +
                '<div id="student-msg" class="text-xs font-bold min-h-[1.5em] text-center"></div>' +
                '<div class="flex items-center justify-between pt-2"><button onclick="checkAnswer()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow cursor-pointer">✅ 確認答案</button><button onclick="nextQuestion()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow cursor-pointer">下一關 &rarr;</button></div>';
            const dragBox = document.getElementById('student-drag-box');
            if (dragBox) {
                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = new Sortable(dragBox, { animation: 150, ghostClass: 'opacity-50' });
            }
        }
        function checkAnswer() {
            const q = questions[currentIndex];
            const dragBox = document.getElementById('student-drag-box');
            const msg = document.getElementById('student-msg');
            if (!dragBox || !msg) return;
            const userStr = Array.from(dragBox.children).map(el => el.textContent.trim()).join('');
            if (userStr === q.answerStr) {
                playSfx('win');
                msg.textContent = "✅ 答對了！真厲害！";
                msg.style.color = "#059669";
            } else {
                playSfx('wrong');
                msg.textContent = "❌ 毋著喔！順序不對，請重新調整！";
                msg.style.color = "#dc2626";
            }
        }
        function nextQuestion() { 
            currentIndex++; 
            renderGame(); 
            const q = questions[currentIndex];
            if (q) { playDualAudio(q.audioUrl, q.audioBackupUrl); }
        }
        function resetGame() { 
            currentIndex = 0; 
            renderGame(); 
            const q = questions[currentIndex];
            if (q) { playDualAudio(q.audioUrl, q.audioBackupUrl); }
        }
    </script>
</body>
</html>
